  en: {
    name: 'English', nav: 'How to use', title: 'How to use the dashboard', sub: 'A short guide, task by task. The names in boxes are the buttons and pages as you see them on the screen.',
    toc: 'Contents', search: 'Search the guide...', none: 'Nothing found in the guide.',
    sections: [
      { id: 'what', title: 'What the dashboard is and how to open it', intro: 'The dashboard is the control panel of HRSystem on this computer: it shows whether the program runs, makes backups, updates it and notifies you on the phone.', items: [
        'Open it with the HRSystem Dashboard icon on the Desktop (or Dashboard.bat). It opens only on this computer (127.0.0.1): not from the internet, not from another computer of the network.',
        'The menu is on the left. At its bottom [[Collapse the menu]] narrows it to a strip of icons and [[Expand the menu]] brings the names back (also with Ctrl+B); the choice is remembered. When it is narrow, the name of a page shows beside its icon as soon as you point at it or reach it with the keyboard; the red error count stays on the icon. On a phone the menu opens from the button at the top left and closes when you choose a page.',
        'At the top: the search (Ctrl K) finds every page and action. The [[Online]] or [[Off]] mark shows the state of the program on every page. [[Open the app]] opens the program. The sun or moon changes the theme. The bell collects what is waiting (the red number).',
        'At the bottom of the menu: [[LIVE]] means the page refreshes by itself (press it to refresh now); beside it is the version of the dashboard. The globe opens the choice of language: Shqip, English, Srpski.',
        'The dashboard updates itself: every minute it checks for a new version and the page reloads once.',
      ] },
      { id: 'home', title: 'Reading the Home page', intro: 'Read it from the top: the state now, what is waiting for you, then the details.', items: [
        'The large line at the top says the state: [[Everything is running]], [[1 thing needs attention]] or [[The application is off]]. Under it only the things that wait are listed, each with the button that solves it (for example [[Back up now]] or [[Update to 1.0.18]]).',
        'Quick actions: [[Backup]], [[Versions]] (or [[Update to ...]] when there is a new version), [[Open the database]], [[Log]], [[History]] and [[Errors]].',
        '[[System health]]: one line for each part (Application, Database, Latest backup, Version, Public address, Disk space, Node.js, GitHub token, Errors). Every state has a symbol, a word and a colour: the green tick = fine, the amber triangle = have a look, the red cross = a problem.',
        '[[Latest actions]]: the last 8 actions with their time; [[See all]] opens History.',
        '[[Resources]]: CPU and RAM of the HR system only (not the whole computer), how much space the program, the database and the backups take, and the traffic (Download / Upload) now, today and since the start.',
        '[[Addresses]]: the local address, the domain and the tunnel, with [[Open]] and [[Copy the address]].',
        'The buttons at the top right: [[Open /developer]], [[Restart]], [[Stop]], [[Start]]. Stop works only while the program runs, Start only while it is off.',
        'On a phone the parts become tiles, two per row.',
      ] },
      { id: 'update', title: 'Updating the program', steps: [
        'When there is a new version it shows on Home and under the bell: [[A new program version]].',
        'Press [[Update to ...]] (on Home or in [[Actions]] › [[Update]]) and confirm the question.',
        'Wait a few minutes: a backup is made, the version is downloaded and built, the database changes are applied and the program switches to the new one. The progress shows in the bar at the top and in [[Log]].',
        'If something fails, the old version comes back by itself and a red notice appears with [[See the log]].',
      ], items: [
        'Automatically at night: in [[Actions]] › [[Database]] › [[Automatic backup and update]] choose the hour and switch on [[Update the program]].',
        '[[Check for updates]] (in [[Actions]] › [[Update]]) asks now whether there is a new version.',
        'Going back to an older version: [[Versions]] on Home, or [[Actions]] › [[Recovery and danger zone]] › [[Go back to a version...]]. [[Restore]] brings back the program only; [[Restore + database]] also brings back the database from the backup of that version. After going back, automatic updates stop until a newer version, or until you press [[Remove the pin]].',
      ] },
      { id: 'backup', title: 'Backups and restore', intro: 'A backup is the copy of the database: the staff, the hours, the leave, everything written in the program. The program itself comes from GitHub and is not kept in the backup.', items: [
        '[[Back up now]] (in [[Backups]] or in [[Actions]] › [[Database]]) makes a copy now.',
        'Automatically: in [[Actions]] › [[Database]] › [[Automatic backup and update]] choose the hour ([[Hour]]) and how many copies are kept ([[Keep]]). After the night job only the newest copies remain, whoever made them.',
        'The table in [[Backups]]: the date, the size, the version of the program when it was made, and the state. [[OK]] = a complete file; [[Damaged]] = do not use it; [[Tested]] = you have tested it.',
        '[[Download]] gets the file. [[Test]] loads it into a temporary database and checks it, without touching your database. [[Open]] opens the folder. [[Delete]] removes it for good (it asks first).',
        '[[Restore]] replaces the database with that copy; before that a backup of the present state is made by itself.',
        'A copy outside this computer: in [[Location]] › [[Copy outside this PC]] press [[Select folder]] and paste the path of an external disk, a network disk or a cloud folder (for example OneDrive). Every backup is copied there by itself, so the copies survive even if the computer breaks.',
        '[[Export SQL]] (in [[Actions]] › [[Database]]) makes a copy and downloads it at once.',
      ] },
      { id: 'db', title: 'Opening the database with phpMyAdmin', steps: [
        'Press [[Open the database]] on Home, or in [[Actions]] › [[Database]] › phpMyAdmin.',
        'A new tab opens with phpMyAdmin, inside the database of the program. You type no password: the dashboard signs you in.',
        'When you are done, press [[Close phpMyAdmin]]. It also closes by itself after 30 minutes without use.',
      ], items: [
        'It is ready without doing anything: PHP and phpMyAdmin are installed by themselves, during the installation of HRSystem or in the background as soon as the dashboard starts (about 50 MB, from the official sites, verified).',
        'The line under phpMyAdmin in [[Actions]] shows the state: [[PHP 8.3 · ready]], or what is wrong.',
        'If it says PHP does not start: usually Microsoft Visual C++ is missing. The dashboard downloads it from Microsoft, installs it by itself and tries again; a damaged installation is installed again by itself. If the message stays, check the internet, restart the computer and press [[Open the database]] again.',
        'It works only from this computer: nobody on the network or the internet can get in. The link is valid once and for 60 seconds, so always open it from the dashboard.',
        'Careful: every change there goes straight into the database. Make a backup before big changes.',
      ] },
      { id: 'address', title: 'Addresses and the tunnel (opening from the internet)', items: [
        'The local address (for example localhost:3000) works only on this computer. For the program to open on phones it needs a public address.',
        'On Home › [[Addresses]] or in [[Data]] press [[Change]]. [[Temporary address]] is created at once, without a domain (it changes every time it is created again). [[My domain (Cloudflare tunnel)]] connects your own domain with the tunnel token: the address stays the same.',
        'Every address shows whether it opens. No address is removed by itself: only with [[Remove]].',
        'If an address does not open for 5 minutes, you get a notification on the phone.',
      ] },
      { id: 'notify', title: 'Notifications on the phone', steps: [
        'Install the free ntfy app on the phone.',
        'In ntfy press + and subscribe to a topic name you choose: long and secret, for example hrsystem-shop-k7x2.',
        'In [[Actions]] › [[Phone notifications]] press [[Set the topic...]] and type exactly the same name.',
        'Press [[Send a test]]: the message should arrive on the phone.',
      ], items: [
        '[[What is notified]]: switch the kinds of messages on or off (Application, Addresses, Backups, Disk, Updates, Bug reports).',
        'A notification comes when: the program stops or starts; the latest backup is older than 2 days; a backup or an update fails; an update is done; an address does not open; the disk is filling up; the copy outside this PC fails; a bug report arrives.',
        '[[Daily report]]: a summary every day at the hour you choose (08:00 at first). [[Send the report]] sends it now.',
        'The topic name is like a password: do not share it.',
      ] },
      { id: 'errors', title: 'Errors, staff reports, Log and History', items: [
        '[[Errors]]: the red number in the menu is the number of errors of the last 24 hours. The tabs [[Dashboard]], [[Application]], [[Update]] and [[Dashboard (output)]] choose the source; [[Filter...]] searches inside. [[Download]] gets them as a file; [[Clear the errors]] empties the dashboard list.',
        '[[Reported bugs]]: the reports the staff send from the program (Profile → About the App → Report a bug), with the name, role, store, page and version.',
        'The tabs [[Reported]], [[In progress]], [[Solved]] and [[Roadmap]]: a report moves from one to another with the buttons [[Take it on]], [[Solved]] and [[Move to the roadmap]].',
        '[[Log]]: the steps of the last action (update, SQL, import, tunnel). [[Download diagnostics]] gives one file with the state and the end of the logs (no passwords), to send to the administrator.',
        '[[History]]: the last 200 actions with their time and result; [[Filter...]] searches inside.',
      ] },
      { id: 'actions', title: 'Other actions: start-up, programs of the system, danger zone', items: [
        '[[Start with Windows]] (in [[Actions]] › [[Application]]): what starts by itself when the computer is switched on (the program with the database, the dashboard, the tunnel).',
        'When the program goes down by itself, the dashboard starts it again after 1 minute and notifies you. If you stop it with [[Stop]], it stays stopped until you press [[Start]].',
        '[[Programs of the system]] (Node.js and cloudflared): when there is a new version, [[Download]] gets and verifies the file without changing anything; then [[Install now]] or [[Set the time]]. [[Update now]] does both. During the installation the program or the tunnel stops for a moment; a new Node.js takes full effect after the computer is restarted.',
        '[[Connections]]: [[GitHub token]] (read-only, to receive updates) and [[Cloudflare Tunnel]] (the public address).',
        '[[Recovery and danger zone]], at the bottom of the page: [[Go back to a version...]], [[Run SQL...]], [[Import the database...]] and [[Uninstall HRSystem...]]. These change or replace data: before each one a backup is made and it asks again. The uninstall asks twice.',
      ] },
      { id: 'pages', title: 'Data and Location', items: [
        '[[Data]]: the addresses, the version, the folders, the database and the settings of the program. Passwords and keys are hidden: [[Show]] reveals them, [[Copy]] copies them.',
        '[[Location]]: the folders of the installation with their full path; [[Open]] opens the folder, the copy icon copies the path. [[Copy outside this PC]] is here too, with [[Copy]], [[Disconnect]], [[Reconnect]] and [[Remove folder]].',
      ] },
      { id: 'settings', title: 'Settings', items: [
        '[[Language]]: Shqip, English or Srpski (also at the bottom of the menu).',
        '[[Appearance]]: the theme ([[System]], [[Light]], [[Dark]]) and the text size. The dashboard has one look: the older looks (Minimal, Glass, Premium, Classic) were removed.',
        '[[Accessibility]]: high contrast, no animations, colour-blind safe colours, larger buttons, stronger focus, pausing the automatic updates.',
        '[[Security]]: the dashboard password is optional; set it if several people use the computer. Forgot it? Delete the file manager\\dashboard.key.',
        '[[Reset]] puts the appearance and accessibility choices back as at the start.',
        '[[Contact the Administrator]]: WhatsApp and email for help.',
      ] },
      { id: 'red', title: 'When something is red', items: [
        'The program shows [[Off]]: press [[Start]] on Home. If it goes down again, open [[Errors]] › [[Application]] and send the diagnostics.',
        'The dashboard does not open: open the HRSystem Dashboard icon on the Desktop (it needs Administrator).',
        'The update failed: the program has gone back to the old version by itself. Open [[Log]] for the reason and try again later.',
        'A backup is [[Damaged]] or old: press [[Back up now]] and check that the disk has room.',
        'The address does not open: check the internet and the tunnel in [[Actions]] › [[Connections]]; with [[Change]] you can create a temporary address.',
        'phpMyAdmin says PHP is not ready: see the part "Opening the database with phpMyAdmin".',
        'Notifications do not arrive: the topic name must be the same on the phone and in the dashboard; then [[Send a test]].',
        '[[Reported bugs]] says the program has no reporting: the program must be 1.0.7 or newer.',
        'You cannot solve it: [[Settings]] › [[Contact the Administrator]], and send the file from [[Download diagnostics]].',
      ] },
    ],
  },
  sr: {
    name: 'Srpski', nav: 'Kako se koristi', title: 'Kako se koristi dashboard', sub: 'Kratko uputstvo, zadatak po zadatak. Nazivi u okvirima su dugmad i stranice kako ih vidiš na ekranu.',
    toc: 'Sadržaj', search: 'Pretraži uputstvo...', none: 'Ništa nije pronađeno u uputstvu.',
    sections: [
      { id: 'what', title: 'Šta je dashboard i kako se otvara', intro: 'Dashboard je kontrolna tabla HRSystem-a na ovom računaru: pokazuje da li program radi, pravi backup, ažurira ga i obaveštava te na telefon.', items: [
        'Otvara se ikonom HRSystem Dashboard na Desktopu (ili sa Dashboard.bat). Otvara se samo na ovom računaru (127.0.0.1): ne sa interneta, ni sa drugog računara u mreži.',
        'Levo je meni. Na njegovom dnu [[Skupi meni]] ga sužava na traku ikona, a [[Proširi meni]] vraća nazive (i sa Ctrl+B); izbor se pamti. Kad je uzak, naziv stranice se pojavi pored ikone čim staneš na nju ili dođeš tastaturom; crveni broj grešaka ostaje na ikoni. Na telefonu se meni otvara dugmetom gore levo i zatvara kad izabereš stranicu.',
        'Gore: pretraga (Ctrl K) nalazi svaku stranicu i radnju. Oznaka [[Online]] ili [[Isključeno]] pokazuje stanje programa na svakoj stranici. [[Otvori aplikaciju]] otvara program. Sunce ili mesec menja temu. Zvono skuplja ono što čeka (crveni broj).',
        'Na dnu menija: [[LIVE]] znači da se stranica sama osvežava (pritisni da osvežiš sada); pored je verzija dashboard-a. Globus otvara izbor jezika: Shqip, English, Srpski.',
        'Dashboard se sam ažurira: svakog minuta proverava da li ima nove verzije i stranica se jednom osveži.',

      { id: 'home', title: 'Kako se čita Početna', intro: 'Čita se odozgo: stanje sada, šta čeka na tebe, pa detalji.', items: [
        'Veliki red na vrhu kaže stanje: [[Sve radi]], [[1 stvar traži pažnju]] ili [[Aplikacija je isključena]]. Ispod su samo stvari koje čekaju, svaka sa dugmetom koje je rešava (npr. [[Napravi backup]] ili [[Ažuriraj na 1.0.18]]).',
        'Brze akcije: [[Backup]], [[Verzije]] (ili [[Ažuriraj na ...]] kad ima nove verzije), [[Otvori bazu]], [[Log]], [[Istorija]] i [[Greške]].',

        '[[Adrese]]: lokalna adresa, domen i tunel, sa [[Otvori]] i [[Kopiraj adresu]].',

      { id: 'update', title: 'Kako se ažurira program', steps: [

        'Pritisni [[Ažuriraj na ...]] (na Početnoj ili u [[Akcije]] › [[Ažuriranje]]) i potvrdi pitanje.',
        'Sačekaj nekoliko minuta: pravi se backup, verzija se preuzima i gradi, primenjuju se izmene baze i program prelazi na novu. Napredak se vidi na traci gore i u [[Log]].',

        'Automatski noću: u [[Akcije]] › [[Baza]] › [[Automatski backup i ažuriranje]] izaberi sat i uključi [[Ažuriraj program]].',
        '[[Proveri ažuriranja]] (u [[Akcije]] › [[Ažuriranje]]) pita sada da li ima nove verzije.',
        'Povratak na stariju verziju: [[Verzije]] na Početnoj, ili [[Akcije]] › [[Povraćaj i opasna zona]] › [[Vrati verziju...]]. [[Vrati]] vraća samo program; [[Vrati + bazu]] vraća i bazu iz backup-a te verzije. Posle povratka automatska ažuriranja staju do novije verzije, ili dok ne pritisneš [[Ukloni zakivanje]].',
      ] },
      { id: 'backup', title: 'Backup-i i vraćanje', intro: 'Backup je kopija baze: zaposleni, sati, odsustva, sve što se upisuje u program. Sam program dolazi sa GitHub-a i ne čuva se u backup-u.', items: [
        '[[Napravi backup]] (u [[Backup-i]] ili u [[Akcije]] › [[Baza]]) pravi kopiju sada.',
        'Automatski: u [[Akcije]] › [[Baza]] › [[Automatski backup i ažuriranje]] izaberi sat ([[Sat]]) i koliko kopija se čuva ([[Čuvaj]]). Posle noćnog posla ostaju samo najnovije kopije, ko god da ih je napravio.',
        'Tabela u [[Backup-i]]: datum, veličina, verzija programa kad je napravljen i stanje. [[OK]] = ceo fajl; [[Oštećen]] = ne koristi ga; [[Testirano]] = testirao si ga.',
        '[[Preuzmi]] uzima fajl. [[Testiraj]] ga učitava u privremenu bazu i proverava, bez diranja tvoje baze. [[Otvori]] otvara fasciklu. [[Obriši]] ga briše zauvek (prvo pita).',
        '[[Vrati]] zamenjuje bazu tom kopijom; pre toga se sam pravi backup sadašnjeg stanja.',
        'Kopija van ovog računara: u [[Lokacija]] › [[Kopija van ovog računara]] pritisni [[Izaberi fasciklu]] i nalepi putanju spoljnog diska, mrežnog diska ili cloud fascikle (npr. OneDrive). Svaki backup se tamo sam kopira, pa kopije ostaju i ako se računar pokvari.',
        '[[Izvezi SQL]] (u [[Akcije]] › [[Baza]]) pravi kopiju i odmah je preuzima.',
      ] },
      { id: 'db', title: 'Otvaranje baze sa phpMyAdmin', steps: [
        'Pritisni [[Otvori bazu]] na Početnoj, ili u [[Akcije]] › [[Baza]] › phpMyAdmin.',
        'Otvara se nova kartica sa phpMyAdmin, unutar baze programa. Ne kucaš lozinku: dashboard te sam prijavi.',
        'Kad završiš, pritisni [[Zatvori phpMyAdmin]]. Zatvara se i sam posle 30 minuta bez korišćenja.',
      ], items: [
        'Spreman je bez ikakvog posla: PHP i phpMyAdmin se instaliraju sami, tokom instalacije HRSystem-a ili u pozadini čim se dashboard pokrene (oko 50 MB, sa zvaničnih sajtova, provereno).',
        'Red ispod phpMyAdmin u [[Akcije]] pokazuje stanje: [[PHP 8.3 · spremno]], ili šta nije u redu.',
        'Ako kaže da se PHP ne pokreće: obično nedostaje Microsoft Visual C++. Dashboard ga preuzima od Microsofta, sam ga instalira i proba ponovo; oštećena instalacija se sama ponovo instalira. Ako poruka ostane, proveri internet, restartuj računar i ponovo pritisni [[Otvori bazu]].',
        'Radi samo sa ovog računara: niko sa mreže ili interneta ne može da uđe. Link važi jednom i 60 sekundi, zato ga uvek otvaraj iz dashboard-a.',

      ] },
      { id: 'address', title: 'Adrese i tunel (otvaranje sa interneta)', items: [
        'Lokalna adresa (npr. localhost:3000) radi samo na ovom računaru. Da bi se program otvarao sa telefona, treba javna adresa.',
        'Na Početnoj › [[Adrese]] ili u [[Podaci]] pritisni [[Promeni]]. [[Privremena adresa]] se pravi odmah, bez domena (menja se svaki put kad se ponovo napravi). [[Moj domen (Cloudflare tunel)]] povezuje tvoj domen tokenom tunela: adresa ostaje ista.',
        'Svaka adresa pokazuje da li se otvara. Nijedna adresa se ne uklanja sama: samo sa [[Ukloni]].',

      { id: 'notify', title: 'Obaveštenja na telefonu', steps: [

        'U [[Akcije]] › [[Obaveštenja na telefonu]] pritisni [[Postavi temu...]] i upiši tačno isti naziv.',

      { id: 'errors', title: 'Greške, prijave zaposlenih, Log i Istorija', items: [

// One status request at a time (a slow measurement must not pile up), and background refreshes stay silent when the dashboard is briefly unreachable (e.g. while it restarts itself).

const byOf = (x) => (x && x.title === 'Perditesim' && x.by) ? (x.by === 'auto' ? 'automatikisht' : 'manualisht') : '';

  else { startLive(); load(); }
