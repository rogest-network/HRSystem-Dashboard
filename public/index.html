<body>
<a class="skip" href="#page" id="skip">Kalo te përmbajtja</a>
<div class="app">
  <aside class="side" id="side" aria-label="Menu"></aside>
  <main class="main" id="main"><div class="page" id="page" tabindex="-1"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const KEY = '__KEY__';
const VER = '__VER__';
const BOOT = '__BOOT__';
// The key of this page is new on every start of the dashboard (it also restarts itself after an update): a request with the old key answers
// 403 "forbidden". The page then reloads itself once to get the new key, instead of showing "forbidden" on every button.
(() => {
  const plainFetch = window.fetch.bind(window);
  window.fetch = async (...args) => {
    const res = await plainFetch(...args);
    if (res.status === 403 && String(args[0]).startsWith('/api/') && !window.__reloading) {
      const j = await res.clone().json().catch(() => ({}));
      if (j.error === 'forbidden') { window.__reloading = true; const t = document.getElementById('toast'); if (t) { t.textContent = 'Dashboard-i u rinis: po rifreskohet...'; t.className = 'toast show'; } setTimeout(() => location.reload(), 1200); }
    }
    return res;
  };
})();
const NL = String.fromCharCode(10);
const $ = (id) => document.getElementById(id);
const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
// 24-hour clock everywhere (dd.mm.yyyy HH:MM[:SS]); built by hand so the browser's language settings cannot bring back AM/PM.
const two = (n) => String(n).padStart(2, '0');
const fmtTime = (s, secs) => { const d = new Date(s); return isNaN(d) ? '-' : two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()) + (secs ? ':' + two(d.getSeconds()) : ''); };
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* private window */ } } };

// One status request at a time (a slow measurement must not pile up), and background refreshes stay silent when the dashboard is briefly unreachable (e.g. while it restarts itself).
const jobName = (t) => ({ Perditesim: 'Përditësimi i aplikacionit', 'Rikthim i versionit': 'Rikthimi i versionit', 'Cloudflare Tunnel': 'Lidhja e tunelit', 'Heqja e tunelit': 'Heqja e tunelit' }[t] || t);
// Progress of a running job. The updater prints a header "=== step ===" for each stage; each stage has a share of the bar. The build is the long one
// (a few minutes), so inside it the bar creeps forward with the elapsed time until the next header arrives.
const UPDATE_STEPS = [['Versioni i instaluar', 5, 'Kontroll'], ['GitHub', 10, 'Kontroll në GitHub'], ['Versioni i ri', 15, 'Shkarkim'], ['Backup i databazes', 28, 'Backup i databazës'], ['Skedaret e versionit', 38, 'Skedarët e versionit'], ['Paketat dhe build', 50, 'Build'], ['SQL i versionit', 82, 'Migrimet'], ['Ndrrimi i versionit', 92, 'Ndërrimi i versionit']];
function progressOf(job) {
  if (job.state === 'ok') return { pct: 100, label: 'U krye' };
  if (job.state === 'error') return { pct: 100, label: 'Dështoi' };
  if (job.title !== 'Perditesim' && !(job.title === 'Rikthim i versionit' && (job.lines || []).some((l) => /^=== /.test(l)))) return { pct: null, label: 'Po vazhdon' };

  for (const l of job.lines || []) {

    if (m) for (const [k, p, t] of UPDATE_STEPS) if (m[1].startsWith(k)) { pct = p; label = t; }
    if (/Build-i u krye/.test(l)) { pct = Math.max(pct, 78); label = 'Build u krye'; }
  }

function paintBar(job) {

  if (track) track.className = 'progress' + (pr.pct === null ? ' indet' : '');

// ---- live: one Server-Sent Events connection; the server pushes a light pulse every 3 s (health, job) and a "changed" event when a job ends, a backup

let liveOn = false, liveAt = 0, live = null;
const liveFresh = () => liveOn && Date.now() - liveAt < 9000;
function liveBadge() {

  b.className = 'live' + (liveOn ? '' : ' off');
  t.textContent = liveOn ? 'LIVE' : 'OFFLINE';
}
function applyPulse(d) {

  // The dashboard itself was restarted (Windows restart, update): its run key changed, so this page would answer "forbidden". Reload ONCE to get the new key.
  if (d.k && BOOT !== '__BOOT__' && d.k !== BOOT) {
    let seen = ''; try { seen = sessionStorage.getItem('reloadedBoot') || ''; } catch { /* no storage */ }
    if (seen !== d.k) { try { sessionStorage.setItem('reloadedBoot', d.k); } catch { /* no storage */ } location.reload(); return; }
  }
  if (d.v && VER !== '__VER__' && d.v !== VER) {
    let last = ''; try { last = sessionStorage.getItem('reloadedFor') || ''; } catch { /* no storage */ }
    if (last !== d.v) { try { sessionStorage.setItem('reloadedFor', d.v); } catch { /* no storage */ } location.reload(); return; }
  }

    const s = state.data.instances.find((i) => i.id === p.id);
    if (!s) continue;
    if (s.health.ok !== p.ok) needFull = true; // on <-> off: the Stop / Start buttons change

    const hist = s.health.history || [];
    if (p.ok || hist[hist.length - 1] !== null) s.health.history = [...hist.slice(-23), p.ok ? Math.max(1, p.ms) : null]; // an off application adds nothing every 3 s
    const was = s.job && s.job.state;

// What counts as a change: everything except the speed samples, the log lines and the clock.

let loading = false, again = false;

// While an update / SQL / import / tunnel runs, only its log is refreshed (every 3 s); a full refresh would measure everything again.
