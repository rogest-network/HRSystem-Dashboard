     switches, responsive. Sizes are rem so the "text size" setting scales everything.
     ===================================================================================================== */
  :root {
    color-scheme: light;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-d: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, "SF Mono", Menlo, monospace;
    /* type: 12 · 13 · 14 · 16 · 19 · 24 (ratio about 1.2) */
    --t-xs: .75rem; --t-sm: .8125rem; --t-md: .875rem; --t-lg: 1rem; --t-xl: 1.1875rem; --t-2xl: 1.5rem;
    /* space: steps of 4 */
    --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.25rem; --s6: 1.5rem; --s7: 2rem; --s8: 2.5rem;
    --r-sm: 6px; --r: 8px; --r-lg: 12px;
    --ctl: 2.25rem; --ctl-sm: 1.875rem; --tap: 2.75rem;
    --side-w: 15.5rem; --rail-w: 4rem; --page-max: 95rem;
    --ease: cubic-bezier(.23, 1, .32, 1);

    --bg: #F4F5F7; --surface: #FFFFFF; --sunken: #EEF0F4; --rail: #FAFAFB; --hover: #EEF0F4; --press: #E3E6EC;
    --text: #171C26; --text-2: #4A5465; --text-3: #5F697B;
    --line: #E1E4EA; --line-2: #D2D6DE; --ctl-line: #8A93A4;
    --accent: #1F4FD1; --accent-h: #1941B0; --accent-bg: #E8EEFC; --on-accent: #FFFFFF; --focus: #1F4FD1;
    --ok: #0F7A45; --ok-bg: #E2F4EA; --warn: #8A5300; --warn-bg: #FBEFD6; --bad: #B4231A; --bad-bg: #FCE6E4;
    --info: #1F4FD1; --info-bg: #E8EEFC; --pend: #5B3CC4; --pend-bg: #EEE9FB; --mute: #4A5465; --mute-bg: #ECEEF2;
    --bad-solid: #B4231A; --on-bad: #FFFFFF;
    --shadow-1: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-2: 0 12px 32px -8px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .06);
    --scrim: rgba(16, 20, 28, .45);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0E1116; --surface: #161A21; --sunken: #11141A; --rail: #12151B; --hover: #1E232C; --press: #272D38;
    --text: #E8EBF1; --text-2: #B3BBC9; --text-3: #939DAE;
    --line: #262C37; --line-2: #333A47; --ctl-line: #6B7587;
    --accent: #8AB0FF; --accent-h: #A6C3FF; --accent-bg: rgba(138, 176, 255, .14); --on-accent: #0B1220; --focus: #A6C3FF;
    --ok: #5ED39A; --ok-bg: rgba(94, 211, 154, .13); --warn: #F0BF5F; --warn-bg: rgba(240, 191, 95, .13); --bad: #FF8F85; --bad-bg: rgba(255, 143, 133, .14);
    --info: #8AB0FF; --info-bg: rgba(138, 176, 255, .14); --pend: #B9A6FF; --pend-bg: rgba(185, 166, 255, .15); --mute: #B3BBC9; --mute-bg: rgba(179, 187, 201, .12);
    --bad-solid: #D13438; --on-bad: #FFFFFF;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 16px 40px -8px rgba(0, 0, 0, .6), 0 2px 8px rgba(0, 0, 0, .4);
    --scrim: rgba(0, 0, 0, .6);
  }

  /* ---------------------------------------------------------------- base */
  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scrollbar-color: var(--line-2) transparent; scrollbar-gutter: stable; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--t-md)/1.5 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; overflow-wrap: break-word; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  h1, h2, h3, p { margin: 0; }
  h1 { font: 600 var(--t-2xl)/1.2 var(--font-d); letter-spacing: -.012em; text-wrap: balance; }
  h2 { font: 600 var(--t-lg)/1.3 var(--font-d); letter-spacing: -.005em; }
  h3 { font: 600 var(--t-md)/1.4 var(--font); }
  a { color: var(--accent); text-decoration: none; text-underline-offset: .18em; }
  a:hover { text-decoration: underline; }
  b, strong { font-weight: 600; }
  img, svg { display: block; flex: none; }
  svg { pointer-events: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: var(--s2) 0; }
  kbd { font: 500 var(--t-xs)/1 var(--font); color: var(--text-3); background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: .2rem .35rem; white-space: nowrap; }
  code, .mono { font-family: var(--mono); font-size: .93em; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
  .skip { position: fixed; left: var(--s3); top: var(--s3); z-index: 200; padding: var(--s2) var(--s4); background: var(--accent); color: var(--on-accent); border-radius: var(--r); font-weight: 600; transform: translateY(-200%); }
  .skip:focus { transform: none; text-decoration: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------------------------------------------------------------- controls */
  button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
  button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:disabled { cursor: not-allowed; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--ctl); padding: 0 var(--s4); border: 1px solid var(--accent); border-radius: var(--r); background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: var(--t-md); line-height: 1.2; white-space: nowrap; text-decoration: none; position: relative; user-select: none; transition: background-color .15s, border-color .15s, color .15s, transform .12s var(--ease); }
  a.btn:hover { text-decoration: none; }
  .btn.ghost { background: var(--surface); color: var(--text); border-color: var(--line-2); font-weight: 500; }
  .btn.danger { background: var(--surface); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line-2)); font-weight: 500; }
  .btn.danger-solid { background: var(--bad-solid); border-color: var(--bad-solid); color: var(--on-bad); }
  .btn.sm { min-height: var(--ctl-sm); padding: 0 var(--s3); font-size: var(--t-sm); }
  .btn:not(:disabled):active, .iconbtn:not(:disabled):active, .tb:not(:disabled):active, .nv:not(:disabled):active { transform: scale(.97); }
  .btn:disabled, .iconbtn:disabled { opacity: .5; }
  .btn.ghost:disabled { background: var(--sunken); }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-height: var(--ctl-sm); min-width: var(--ctl-sm); padding: 0 var(--s2); border-radius: var(--r-sm); color: var(--accent); font-weight: 500; font-size: var(--t-sm); white-space: nowrap; transition: background-color .15s, transform .12s var(--ease); }
  @media (hover: hover) and (pointer: fine) {
    .btn:not(:disabled):hover { background: var(--accent-h); border-color: var(--accent-h); }
    .btn.ghost:not(:disabled):hover { background: var(--hover); border-color: var(--line-2); }
    .btn.danger:not(:disabled):hover { background: var(--bad-bg); border-color: var(--bad); }
    .btn.danger-solid:not(:disabled):hover { background: color-mix(in srgb, var(--bad-solid) 88%, #000); border-color: transparent; }
    .iconbtn:not(:disabled):hover { background: var(--accent-bg); }
  }
  /* a button whose action is still running: the label stays (so the width does not change), a spinner sits over it */
  .is-busy { color: transparent !important; pointer-events: none; }
  .is-busy > * { visibility: hidden; }
  .is-busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 1rem; height: 1rem; border-radius: 50%; border: 2px solid var(--on-accent); border-right-color: transparent; animation: spin .6s linear infinite; }
  .btn.ghost.is-busy::after, .iconbtn.is-busy::after, .qa.is-busy::after { border-color: var(--text-2); border-right-color: transparent; }
  .btn.danger.is-busy::after { border-color: var(--bad); border-right-color: transparent; }
  .iconbtn.is-busy { position: relative; }
  @keyframes spin { to { transform: rotate(360deg); } }

  input[type="text"], input[type="search"], input[type="password"], input[type="time"], input[type="datetime-local"], select, textarea {
    min-height: var(--ctl); padding: 0 var(--s3); border: 1px solid var(--ctl-line); border-radius: var(--r); background: var(--surface); color: var(--text); font-size: var(--t-md); max-width: 100%; transition: border-color .15s, box-shadow .15s; }
  input::placeholder { color: var(--text-3); opacity: 1; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); border-radius: var(--r); }
  select { appearance: none; padding-right: 2rem; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 1rem) 52%, calc(100% - .7rem) 52%; background-size: .3rem .3rem; background-repeat: no-repeat; }
  input[type="search"] { width: min(22rem, 100%); }
  input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: var(--s2); font-weight: 600; font-size: var(--t-sm); color: var(--text-2); }
  fieldset + fieldset { margin-top: var(--s5); }
  /* segmented choice (radios) and tabs share one look */
  .opts, .tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r); max-width: 100%; }
  .opt, .tabs > button { display: inline-flex; align-items: center; gap: var(--s2); min-height: calc(var(--ctl) - 8px); padding: 0 var(--s3); border-radius: var(--r-sm); color: var(--text-2); font-weight: 500; font-size: var(--t-sm); cursor: pointer; white-space: nowrap; position: relative; }
  .opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .opt:has(input:checked), .tabs > button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-1), 0 0 0 1px var(--line); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tabs .n { font-weight: 600; color: var(--text-3); }
  @media (hover: hover) and (pointer: fine) { .opt:not(:has(input:checked)):hover, .tabs > button:not([aria-selected="true"]):hover { color: var(--text); background: var(--hover); } }
  /* switch */
  .sw { display: inline-flex; align-items: center; gap: var(--s3); min-height: var(--ctl); cursor: pointer; font-size: var(--t-md); position: relative; }
  .sw input { position: absolute; opacity: 0; width: 2.5rem; height: 1.5rem; margin: 0; cursor: pointer; }
  .sw i { flex: none; width: 2.5rem; height: 1.5rem; border-radius: 99px; background: var(--ctl-line); position: relative; transition: background-color .15s; }
  .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: calc(1.5rem - 6px); height: calc(1.5rem - 6px); border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .16s var(--ease); }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { transform: translateX(1rem); }
  :root[data-theme="dark"] .sw input:checked + i::after { background: var(--on-accent); }
  .sw input:focus-visible + i { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sw input:disabled + i { opacity: .5; }
  .switches { display: grid; gap: var(--s1); }

  /* ---------------------------------------------------------------- shell */
  /* The side menu: a sidebar with names, or a rail of icons. Both share one column of 44 px items: the icons stay in the same place, the names only
     appear beside them. Groups: the pages (with lines between everyday work | where things are | what happened), the guide and settings, then the
     foot (LIVE, language, the collapse control). --rail-pad is the space between the menu edge and its items (the accent bar of the current page
     sits in it). */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
  .app.collapsed { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
  .side { --rail-pad: var(--s3); position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 2px; padding: var(--s3) var(--rail-pad); background: var(--rail); border-right: 1px solid var(--line); overflow: hidden auto; scrollbar-width: none; z-index: 30; }
  .side::-webkit-scrollbar { display: none; }
  .brand { display: flex; align-items: center; gap: var(--s3); min-height: var(--tap); padding: 0 var(--s3) 0 .625rem; margin-bottom: var(--s2); border-radius: var(--r); color: var(--text); width: 100%; }
  .brand .logo { height: 1.375rem; width: auto; flex: none; }
  .brand-t { display: grid; line-height: 1.2; min-width: 0; }
  .brand-t b { font: 600 var(--t-lg)/1.2 var(--font-d); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand-t small { font-size: var(--t-xs); color: var(--text-3); }
  .nav { display: grid; gap: 2px; align-content: start; }
  .nav-sep { border: 0; border-top: 1px solid var(--line); margin: .375rem .375rem; }
  .nv { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--tap); padding: 0 .75rem; border-radius: var(--r); color: var(--text-2); font-weight: 500; font-size: var(--t-md); text-align: left; position: relative; transition: background-color .12s, color .12s, transform .12s var(--ease); }
  .nv > svg, .nv .ic svg { width: 1.25rem; height: 1.25rem; }
  .nv .ic { position: relative; display: grid; place-items: center; flex: none; }
  .nv .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nv.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .nv.on::before { content: ""; position: absolute; left: calc(var(--rail-pad) * -1); top: 50%; width: 3px; height: 1.25rem; translate: 0 -50%; border-radius: 0 3px 3px 0; background: var(--accent); }
  @media (hover: hover) and (pointer: fine) { .nv:not(.on):hover, .brand:hover { background: var(--hover); color: var(--text); } }
  .cnt { flex: none; min-width: 1.375rem; height: 1.375rem; padding: 0 .375rem; border-radius: 99px; background: var(--mute-bg); color: var(--text-2); font-size: var(--t-xs); font-weight: 600; line-height: 1.375rem; text-align: center; }
  .cnt.alert { background: var(--bad-solid); color: var(--on-bad); }
  .side-foot { margin-top: auto; display: grid; gap: 2px; padding-top: var(--s4); }
  .side-foot > .nav-sep:first-child { margin-top: 0; }
  .dot { flex: none; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--text-3); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.info { background: var(--info); } .dot.pend { background: var(--pend); }
  /* LIVE: the pulse icon with its state as a dot on the corner (green live, red offline, amber paused) */
  .nv.live .ic .dot { position: absolute; right: -.25rem; bottom: -.125rem; width: .5625rem; height: .5625rem; background: var(--ok); box-shadow: 0 0 0 2px var(--rail); }
  .nv.live.off .ic .dot { background: var(--bad); } .nv.live.paused .ic .dot { background: var(--warn); }
  .nv.live .lbl b { font-weight: 600; color: var(--text); letter-spacing: .02em; }
  .nv .tail { flex: none; display: grid; place-items: center; color: var(--text-3); } .nv .tail svg { width: 1rem; height: 1rem; }
  .credit { padding: var(--s2) .75rem 0; font-size: var(--t-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .credit b { color: var(--text-2); }
  /* the rail: one centred column of 44 px squares; names as tooltips beside the rail; counts as a badge on the icon's corner */
  .app.collapsed .side { --rail-pad: calc((var(--rail-w) - var(--tap)) / 2); }
  .app.collapsed .side .lbl, .app.collapsed .credit { display: none; }
  .app.collapsed .nv, .app.collapsed .brand { width: var(--tap); height: var(--tap); min-height: 0; padding: 0; justify-content: center; }
  .app.collapsed .brand .logo { height: 1.25rem; }
  .app.collapsed .nav-sep { margin: .375rem 0; }
  .app.collapsed .cnt { position: absolute; top: .3125rem; left: 1.5625rem; min-width: 1rem; height: 1rem; padding: 0 .25rem; font-size: .625rem; line-height: 1rem; box-shadow: 0 0 0 2px var(--rail); }
  .app.collapsed .nv.on .cnt { box-shadow: 0 0 0 2px var(--accent-bg); }
  .app.collapsed .cnt:not(.alert) { display: none; }
  /* opening the menu: the names slide in (transform and opacity only, 180 ms); the width changes in one step, so the page reflows once, never animates */
  .app.side-anim:not(.collapsed) .side .lbl, .app.side-anim:not(.collapsed) .credit { animation: lblin .18s var(--ease) both; }
  @keyframes lblin { from { opacity: 0; transform: translateX(-.5rem); } }
  .tip { position: fixed; z-index: 120; max-width: 18rem; padding: .375rem .625rem; border-radius: var(--r-sm); background: var(--text); color: var(--bg); font-size: var(--t-sm); font-weight: 500; line-height: 1.25; pointer-events: none; box-shadow: var(--shadow-2); opacity: 0; translate: 0 -50%; transform: translateX(-.25rem); transition: opacity .1s, transform .1s var(--ease); }
  .tip::before { content: ""; position: absolute; left: -4px; top: 50%; width: 8px; height: 8px; background: inherit; transform: translateY(-50%) rotate(45deg); border-radius: 1px; }
  .tip.show { opacity: 1; transform: none; }
  .tip.instant { transition: none; }
  .scrim { display: none; }
  /* the menu button of the top bar opens the drawer on a phone or tablet; on a computer the collapse control is in the menu itself */
  @media (min-width: 61.3125rem) { #sidebtn { display: none; } }
  #main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--s2); min-height: 3.75rem; padding: var(--s2) var(--s6); background: var(--bg); border-bottom: 1px solid var(--line); }
  .tb { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-width: var(--tap); height: var(--tap); padding: 0 var(--s3); border-radius: var(--r); color: var(--text-2); font-weight: 500; white-space: nowrap; position: relative; transition: background-color .12s, color .12s, transform .12s var(--ease); }
  .tb svg { width: 1.25rem; height: 1.25rem; }
  @media (hover: hover) and (pointer: fine) { .tb:hover { background: var(--hover); color: var(--text); } }
  .tb[aria-haspopup][aria-expanded="true"] { background: var(--press); color: var(--text); }
  .tb .badge { position: absolute; top: .25rem; right: .25rem; min-width: 1.125rem; height: 1.125rem; padding: 0 .25rem; border-radius: 99px; background: var(--bad-solid); color: var(--on-bad); font-size: .6875rem; font-weight: 700; line-height: 1.125rem; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
  .search { flex: 0 1 26rem; min-width: 0; display: flex; align-items: center; gap: var(--s2); height: 2.5rem; padding: 0 var(--s3); border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--text-3); transition: border-color .12s; }
  .search span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .search svg { width: 1.125rem; height: 1.125rem; }
  @media (hover: hover) and (pointer: fine) { .search:hover { border-color: var(--ctl-line); color: var(--text-2); } }
  .tb-end { margin-left: auto; display: flex; align-items: center; gap: var(--s1); }
  .appchip { display: inline-flex; align-items: center; gap: var(--s2); height: 2rem; padding: 0 var(--s3); margin-right: var(--s2); border-radius: 99px; background: var(--ok-bg); color: var(--ok); font-size: var(--t-sm); font-weight: 600; white-space: nowrap; }
  .appchip.down { background: var(--bad-bg); color: var(--bad); }
  .appchip span { font-weight: 400; }
  .tb.open { border: 1px solid var(--line-2); background: var(--surface); color: var(--text); height: 2.5rem; }
  .page { container: page / inline-size; width: 100%; max-width: var(--page-max); margin: 0 auto; padding: var(--s6) var(--s6) var(--s8); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); align-content: start; }
  .page > div:not(.banner) { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); align-content: start; min-width: 0; }
  .page > div:not(.banner) > * { min-width: 0; }

  /* ---------------------------------------------------------------- page parts */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3) var(--s5); flex-wrap: wrap; }
  .top > div:first-child { min-width: min(100%, 16rem); flex: 1 1 16rem; }
  .top p { margin-top: var(--s1); color: var(--text-2); max-width: 72ch; text-wrap: pretty; }
  .top .tr { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
  .row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
  .row.end { justify-content: flex-end; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5); min-width: 0; box-shadow: var(--shadow-1); }
  .card > h2, .card-h { margin-bottom: var(--s3); }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; min-height: var(--ctl-sm); }
  .card-h h2 { margin: 0; }
  .card.flush { padding: 0; overflow: hidden; }

    .page, .page > div:not(.banner), .stack, .grid2, .cols, .help { gap: var(--s4); }
    .card { padding: var(--s4); border-radius: var(--r); }
    .card.flush > h2, .card.flush > .card-h { padding: var(--s3) var(--s4); }
    .card.flush > .card-f { padding: var(--s3) var(--s4); }
    .search { flex: 0 0 var(--tap); width: var(--tap); height: var(--tap); padding: 0; justify-content: center; border: 0; background: none; color: var(--text-2); }
    .search span, .search kbd { display: none; }
    .search svg { width: 1.25rem; height: 1.25rem; }
    .appchip b { display: none; } .appchip { background: none; padding: 0 var(--s1); } .appchip .dot { width: .625rem; height: .625rem; }
    .top .tr, .top .tr > .row { width: 100%; }
    .top .tr .btn { flex: 1 1 auto; }
    .top .tr > .row:has(> :nth-child(4)) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .state-h { padding: var(--s4); align-items: flex-start; } .state-h .tr { margin-left: 0; width: 100%; }
    .todo li { padding: var(--s3) var(--s4); } .todo li .tt { flex-basis: calc(100% - 2rem); } .todo li .btn { flex: 1 1 auto; }
    .feed li, .addr > div, .meter { padding-inline: var(--s4); }
    .ledger td.k { width: auto; }
    .item { align-items: stretch; }
    .item > .row { flex: 1 1 100%; justify-content: flex-start; }
    .item > .row > .btn, .fold-actions > .btn, .banner .row > .btn { flex: 1 1 auto; }
    .item > .row > input { flex: 1 1 100%; }
    .dlg-overlay, .modal-overlay { place-items: end center; padding: 0; }
    .dlg, .modal { width: 100%; border-radius: var(--r-lg) var(--r-lg) 0 0; border-width: 1px 0 0; padding-bottom: calc(var(--s5) + env(safe-area-inset-bottom, 0px)); animation-name: sheetin; max-height: 92dvh; }
    @keyframes sheetin { from { transform: translateY(100%); } }
    .dlg-actions { flex-direction: column-reverse; } .dlg-actions .btn, .modal > .row > .btn { width: 100%; }
    .cmdk-overlay { padding: var(--s2); padding-top: max(var(--s2), env(safe-area-inset-top, 0px)); }
    .cmdk { max-height: calc(100dvh - 1rem); } .cmdk .ft { display: none; }
    .toast { left: var(--s4); right: var(--s4); max-width: none; }
    .pop { left: var(--s2) !important; right: var(--s2) !important; max-width: none; }
    .tabs, .opts { display: flex; flex-wrap: wrap; width: 100%; }
    .tabs > button, .opt { flex: 1 1 auto; justify-content: center; }
    input[type="search"] { width: 100%; }
    .kv td.k { min-width: 0; }
  }
</style>

<script>

// The key of this page is new on every start of the dashboard (it also restarts itself after an update): a request with the old key answers
// 403 "forbidden". The page then reloads itself once to get the new key, instead of showing "forbidden" on every button.
(() => {
  const plainFetch = window.fetch.bind(window);
  window.fetch = async (...args) => {
    const res = await plainFetch(...args);
    if (res.status === 403 && String(args[0]).startsWith('/api/') && !window.__reloading) {
      const j = await res.clone().json().catch(() => ({}));
      if (j.error === 'forbidden') { window.__reloading = true; const t = document.getElementById('toast'); if (t) { t.textContent = 'Dashboard-i u rinis: po rifreskohet...'; t.className = 'toast show'; } setTimeout(() => location.reload(), 1200); }
    }
    return res;
  };
})();
const NL = String.fromCharCode(10);
const $ = (id) => document.getElementById(id);
const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
// 24-hour clock everywhere (dd.mm.yyyy HH:MM[:SS]); built by hand so the browser's language settings cannot bring back AM/PM.
const two = (n) => String(n).padStart(2, '0');
const fmtTime = (s, secs) => { const d = new Date(s); return isNaN(d) ? '-' : two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()) + (secs ? ':' + two(d.getSeconds()) : ''); };
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* private window */ } } };
// Notices the owner closed stay closed after a refresh or a restart (2.0, owner 2026-10-30): one key per event (type + installation +
// version / job end time), so a NEW event still shows. The newest 80 keys are kept.
const dismissals = {
  read() { try { return JSON.parse(localStorage.getItem('dashDismissed') || '{}') || {}; } catch { return {}; } },
  has(k) { return Boolean(this.read()[k]); },
  add(k) {
    const m = this.read(); m[k] = Date.now();
    const keys = Object.keys(m).sort((a, b) => m[b] - m[a]);
    for (const x of keys.slice(80)) delete m[x];
    try { localStorage.setItem('dashDismissed', JSON.stringify(m)); } catch { /* private window */ }
  },
};
// A notice that is only information (a finished job, the dashboard updated) leaves by itself after a few seconds; the time stops
// while the pointer or the keyboard focus is on it. The deadline lives here, not in the element, because the page is redrawn often.
const AUTO_HIDE_MS = 7000;
const noticeTimers = {};
// 2.0.1: closing animation. A notice fades and slides up, then its height folds so the page below moves up smoothly
// (no jump); a menu or window fades out. done() runs after it (at once with reduced motion). transform/opacity first, then height.
const calmMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.classList.contains('a11y-motion');
function leave(node, done, fold) {
  if (!node || !node.isConnected || calmMotion()) { if (done) done(); else if (node) node.remove(); return; }
  if (node.classList.contains('leaving')) return;
  node.classList.add('leaving');
  setTimeout(() => {
    if (!fold) { if (done) done(); else node.remove(); return; }
    const h = node.getBoundingClientRect().height;
    node.style.height = h + 'px'; node.style.overflow = 'hidden'; void node.offsetHeight;
    node.classList.add('folding');
    setTimeout(() => { if (done) done(); else node.remove(); }, 200);
  }, fold ? 180 : 150);
}
function autoHide(box, key) {
  const now = Date.now();
  const t = noticeTimers[key] || (noticeTimers[key] = { left: AUTO_HIDE_MS, since: now, held: false });
  if (!t.held) { t.left -= now - t.since; t.since = now; }
  if (t.left <= 0) { dismissals.add(key); return false; }
  let timer = null;
  const start = () => { clearTimeout(timer); t.held = false; t.since = Date.now(); timer = setTimeout(() => { dismissals.add(key); leave(box, null, true); }, Math.max(t.left, 1200)); };
  const hold = () => { clearTimeout(timer); if (!t.held) { t.left -= Date.now() - t.since; t.held = true; } };
  box.addEventListener('pointerenter', hold); box.addEventListener('focusin', hold);
  box.addEventListener('pointerleave', start); box.addEventListener('focusout', (e) => { if (!box.contains(e.relatedTarget)) start(); });
  start();
  return true;
}

  ["Njoftim kur aplikacioni bie (1 minutë), kur backup-i ose përditësimi dështon, kur mbaron hapësira dhe kur përditësimi kryhet. Mesazhet nuk kanë të dhëna personale.", "A message when the application is down (1 minute), when a backup or update fails, when space runs out and when an update completes. Messages contain no personal data.", "Poruka kada aplikacija ne radi (1 minut), kada backup ili ažuriranje ne uspe, kada ponestane prostora i kada se ažuriranje završi. Poruke ne sadrže lične podatke."],

  ["Pamje e re \"glass\": sfond i errët me drita të buta, kartela si xham, menu anësore prej xhami dhe ngjyrë kryesore e kaltër (edhe në temën e çelët).", "New \"glass\" look: a dark background with soft lights, glass-like cards, a glass side menu and a cyan main colour (also in the light theme).", "Novi \"glass\" izgled: tamna pozadina sa mekim svetlima, kartice kao staklo, stakleni bočni meni i cijan glavna boja (i u svetloj temi)."],

  ["i fundit", "last", "poslednji"],
  ["Pamje e re \"Minimale\" (e paracaktuar): e pastër dhe profesionale, me sipërfaqe të bardha, vija të holla dhe pa xham; Glass, Premium dhe Klasike mbeten te Cilësimet.", "A new \"Minimal\" look (the default): clean and professional, white surfaces, thin lines and no glass; Glass, Premium and Classic stay in Settings.", "Novi \"Minimalni\" izgled (podrazumevani): čist i profesionalan, bele površine, tanke linije i bez stakla; Glass, Premium i Klasični ostaju u Podešavanjima."],
  ["Përditësimi i Node.js dhe cloudflared nuk përsëritet më: nëse instalimi nuk e ndryshon versionin, i njëjti version nuk provohet më automatikisht.", "The Node.js and cloudflared update no longer repeats: if an installation does not change the version, the same version is not tried again automatically.", "Ažuriranje Node.js i cloudflared se više ne ponavlja: ako instalacija ne promeni verziju, ista verzija se više ne pokušava automatski."],
  ["Ky version nuk do të provohet më automatikisht.", "This version will not be tried again automatically.", "Ova verzija se više neće pokušavati automatski."],
  ["KUJDES: instalimi mbaroi, por ", "WARNING: the installation finished, but ", "PAŽNJA: instalacija je završena, ali "],
  ["Xhami më i fortë mbi një sfond me ngjyra; pa profilin lart djathtas; \"Krijuar nga Rogest Network\" në kartelën anash; njoftimet, menutë dhe dritaret mbyllen me animacion të butë.", "Stronger glass over a coloured background; no profile at the top right; \"Created by Rogest Network\" in the side card; notices, menus and windows close with a soft animation.", "Jače staklo na obojenoj pozadini; bez profila gore desno; \"Napravio Rogest Network\" u bočnoj kartici; obaveštenja, meniji i prozori se zatvaraju mekom animacijom."],
  ["Pamje e re \"Glass\" (e paracaktuar): panele si xham i ngrirë në blu të zbehtë dhe lejla, menu anësore prej xhami dhe shirit sipër me kërkim, temë, njoftime dhe llogari.", "A new \"Glass\" look (the default): frosted-glass panels in pale blue and lavender, a glass side menu and a top bar with search, theme, notifications and account.", "Novi izgled \"Glass\" (podrazumevani): paneli kao mat staklo u svetloplavoj i lavandi, stakleni bočni meni i gornja traka sa pretragom, temom, obaveštenjima i nalogom."],
  ["Kryesore e re: \"Mirë se vini\", statusi, performanca, hapësira dhe rrjeti me grafikë, databaza, versioni, adresat, veprime të shpejta, gjendja e sistemit dhe veprimet e fundit.", "A new Home: \"Welcome\", status, performance, space and network with charts, database, version, addresses, quick actions, system health and recent activity.", "Nova početna: \"Dobro došli\", status, performanse, prostor i mreža sa grafikonima, baza, verzija, adrese, brze radnje, stanje sistema i poslednje radnje."],
  ["Në telefon menuja hapet si sirtar nga butoni lart majtas. Premium (2.0) dhe Klasike mbeten te Cilësimet → Pamja e dashboard-it.", "On a phone the menu opens as a drawer from the button at the top left. Premium (2.0) and Classic stay in Settings → Dashboard look.", "Na telefonu se meni otvara kao fioka sa dugmeta gore levo. Premium (2.0) i Klasični ostaju u Podešavanja → Izgled dashboard-a."],
  ["Dashboard-i e kontrollon versionin e vet të ri çdo minutë (ishte çdo 10 minuta), pa i harxhuar kërkesat e GitHub-it.", "The dashboard checks for its own new version every minute (it was every 10 minutes), without using up GitHub requests.", "Dashboard proverava svoju novu verziju svakog minuta (bilo je na 10 minuta), bez trošenja GitHub zahteva."],
  ["Data te Historiku dhe në tabela shfaqet sërish në një rresht, jo shifër për shifër.", "The date in History and in tables shows on one line again, not one digit per line.", "Datum u Istoriji i u tabelama ponovo se prikazuje u jednom redu, a ne cifru po cifru."],
  ["Më shumë ngjyra dhe lëvizje: gradientë te titujt, butonat dhe kartelat, ndriçim që lëviz ngadalë në sfond.", "More colour and motion: gradients on titles, buttons and cards, a light that drifts slowly in the background.", "Više boja i pokreta: gradijenti na naslovima, dugmadima i karticama, svetlo koje se polako pomera u pozadini."],
  ["Përditësimi i programit nuk dështon më për shkak të njoftimit \"npm notice\" (versioni i ri i npm-it).", "The program update no longer fails because of the \"npm notice\" message (a new npm version).", "Ažuriranje programa više ne zakazuje zbog poruke \"npm notice\" (nova verzija npm-a)."],
  ["Përditësimi i programit nuk dështon më për shkak të paralajmërimeve të npm-it të ri (pas përditësimit të Node.js).", "The program update no longer fails because of warnings from the new npm (after the Node.js update).", "Ažuriranje programa više ne zakazuje zbog upozorenja novog npm-a (posle ažuriranja Node.js)."],
  ["Backup-et: pas punës së natës mbeten vetëm të fundit sa ke zgjedhur (p.sh. 7), pa dallim kush i ka bërë: nata, përditësimi ose butoni.", "Backups: after the night job only the newest ones you chose stay (e.g. 7), whoever made them: the night job, the update or the button.", "Backup-ovi: posle noćnog posla ostaju samo najnoviji koje si izabrao (npr. 7), bez obzira ko ih je napravio: noć, ažuriranje ili dugme."],
  ["Llamba e kuqe nuk ndizet më për një përgjigje të vetme të ngadaltë: aplikacioni dhe adresat pyeten edhe një herë para se të shfaqen si të rënë.", "The red lamp no longer turns on for a single slow answer: the application and the addresses are asked once more before they show as down.", "Crvena lampica se više ne pali zbog jednog sporog odgovora: aplikacija i adrese se pitaju još jednom pre nego što se prikažu kao ugašene."],
  ["Versioni i dashboard-it", "Dashboard version", "Verzija dashboarda"], ["Menuja tregon poshtë LIVE versionin e dashboard-it.", "The menu shows the dashboard version below LIVE.", "Meni prikazuje verziju dashboarda ispod LIVE."],

  ["Rruga e plotë", "Full path", "Puna putanja"], ["Kopjo rrugën", "Copy the path", "Kopiraj putanju"], ["Ndrysho folderin", "Change folder", "Promeni fasciklu"], ["Zgjidh folderin", "Select folder", "Izaberi fasciklu"],

  ["Shkruaj rrugën e plotë të folderit ku kopjohen backup-et (disk i jashtëm, disk rrjeti ose folder cloud), p.sh. E:\\HRBackup ose \\\\server\\share:", "Type the full path of the folder where backups are copied (external drive, network drive or cloud folder), e.g. E:\\HRBackup or \\\\server\\share:", "Unesi punu putanju fascikle u koju se kopiraju backup-ovi (spoljni disk, mrežni disk ili cloud fascikla), npr. E:\\HRBackup ili \\\\server\\share:"],
  ["Heq folderin e kopjes jashtë PC-së?", "Remove the off-PC copy folder?", "Ukloniti fasciklu za kopiju van računara?"],
  ["Backup-et që u kopjuan aty mbeten; nuk fshihen. Më pas backup-et ruhen vetëm në këtë PC.", "The backups copied there stay; they are not deleted. After that, backups are kept only on this PC.", "Backup-ovi kopirani tamo ostaju; ne brišu se. Posle toga se backup-ovi čuvaju samo na ovom računaru."],
  ["Windows nuk lejon shkrim në këtë folder. Zgjidh një folder ku ky përdorues mund të shkruajë, ose jepi lejen te Properties > Security.", "Windows does not allow writing to this folder. Choose a folder this user can write to, or grant permission in Properties > Security.", "Windows ne dozvoljava upis u ovu fasciklu. Izaberi fasciklu u koju ovaj korisnik može da piše ili dodeli dozvolu u Properties > Security."],
  ["Rruga tregon një skedar, jo një folder. Zgjidh një folder.", "The path points to a file, not a folder. Choose a folder.", "Putanja pokazuje na datoteku, a ne na fasciklu. Izaberi fasciklu."],
  ["Nuk ka hapësirë të lirë. Liro vend ose zgjidh një folder tjetër.", "There is no free space. Free some space or choose another folder.", "Nema slobodnog prostora. Oslobodi prostor ili izaberi drugu fasciklu."],
  ["Folderi nuk arrihet. Kontrollo që disku i jashtëm është i lidhur ose kompjuteri i rrjetit është i ndezur, pastaj shtyp \"Kopjo\".", "The folder cannot be reached. Check that the external drive is connected or the network computer is on, then press \"Copy\".", "Fascikla nije dostupna. Proveri da li je spoljni disk povezan ili je mrežni računar uključen, pa pritisni \"Kopiraj\"."],
  ["Kontrollo rrugën e folderit dhe provo përsëri.", "Check the folder path and try again.", "Proveri putanju fascikle i pokušaj ponovo."],
  ["Backup-et mbeten vetëm në këtë PC. Nëse prishet kompjuteri, humbasin.", "Backups stay only on this PC. If the computer fails, they are lost.", "Backup-ovi ostaju samo na ovom računaru. Ako se računar pokvari, gube se."],
  ["Kopjimi automatik është i fikur. Folderi ruhet; shtyp \"Rilidh\" për ta ndezur.", "Automatic copying is off. The folder is kept; press \"Reconnect\" to turn it on.", "Automatsko kopiranje je isključeno. Fascikla se čuva; pritisni \"Ponovo poveži\" da ga uključiš."],
  ["Ende pa kopje. Shtyp \"Kopjo\" për të provuar lidhjen.", "No copy yet. Press \"Copy\" to test the connection.", "Još nema kopije. Pritisni \"Kopiraj\" da proveriš vezu."],

  ["Dashboard-i nuk shfleton disqet: ti ngjit rrugën e plotë dhe ai e provon duke shkruar një skedar të vogël aty.", "The dashboard does not browse disks: you paste the full path and it tests it by writing a small file there.", "Dashboard ne pretražuje diskove: ti nalepiš punu putanju, a on je proverava upisom male datoteke."],
  ["Folderi u kontrollua dhe u ruajt.", "The folder was checked and saved.", "Fascikla je proverena i sačuvana."], ["Kopjimi automatik u fik. Folderi ruhet.", "Automatic copying is off. The folder is kept.", "Automatsko kopiranje je isključeno. Fascikla se čuva."],
  ["Kopjimi automatik u ndez.", "Automatic copying is on.", "Automatsko kopiranje je uključeno."], ["Folderi u hoq.", "The folder was removed.", "Fascikla je uklonjena."],
  ["Folderët e instalimit", "Installation folders", "Fascikle instalacije"], ["Rrugët e instalimit dhe folderi i kopjeve", "Installation paths and the copy folder", "Putanje instalacije i fascikla za kopije"],
  ["Nuk ka folderë për t'u shfaqur.", "No folders to show.", "Nema fascikli za prikaz."],
  ["Pa folder: backup-et mbeten vetëm në këtë PC.", "No folder: backups stay only on this PC.", "Bez fascikle: backup-ovi ostaju samo na ovom računaru."],
  ["Rikthim dhe zona e rrezikut", "Recovery and danger zone", "Povraćaj i opasna zona"], ["Veprime që ndryshojnë ose zëvendësojnë të dhëna. Para secilit bëhet backup dhe të pyet përsëri.", "Actions that change or replace data. A backup is made first and you are asked again.", "Radnje koje menjaju ili zamenjuju podatke. Prvo se pravi backup, a zatim te sistem pita ponovo."],
  ["GABIM", "ERROR", "GREŠKA"], ["KUJDES", "WARNING", "UPOZORENJE"],
  /* dashboard release notes (DASH_NOTES), whole lines so a line is never half translated */
  ["Dashboard-i lexon përditësimet nga emri i ri i GitHub (rogest-network); emri i vjetër vazhdon të punojë.","The dashboard reads updates from the new GitHub name (rogest-network); the old name keeps working.","Dashboard čita ažuriranja sa novog GitHub imena (rogest-network); staro ime i dalje radi."],
  ["Faqe e re në menu: \"Çfarë ka të re\" (dashboard-i dhe programi).","A new page in the menu: \"What is new\" (the dashboard and the program).","Nova stranica u meniju: \"Šta je novo\" (dashboard i program)."],
  ["Versioni i parë me numër: pasqyra, backup-et, përditësimet, njoftimet.","The first numbered version: overview, backups, updates, notifications.","Prva numerisana verzija: pregled, backup-ovi, ažuriranja, obaveštenja."],
  ["Pamje e re profesionale: font Inter, menu e errët, ngjyra vjollcë, karta dhe butona të njëjtë në çdo faqe.","A new professional look: the Inter font, a dark menu, purple accents, and the same cards and buttons on every page.","Novi profesionalni izgled: font Inter, tamni meni, ljubičasti akcenti i iste kartice i dugmad na svakoj stranici."],
  ["Menuja anësore mbyllet me shigjetën lart (vetëm ikona); mbahet mend zgjedhja.","The side menu collapses with the arrow at the top (icons only); your choice is remembered.","Bočni meni se skuplja strelicom na vrhu (samo ikone); izbor se pamti."],
  ["Çfarë ka të re: vetëm versioni i fundit është i hapur, të vjetrit hapen me një klik.","What is new: only the latest version is open; older ones open with a click.","Šta je novo: otvorena je samo najnovija verzija, starije se otvaraju klikom."],
  ["Kopje jashtë PC-së: karta e re e folderit me rrugën e plotë, gjendjen dhe veprimet Ndrysho, Shkëput, Rilidh, Hiq.","Copy outside this PC: a new folder card with the full path, the status and the actions Change, Disconnect, Reconnect, Remove.","Kopija van računara: nova kartica fascikle sa punom putanjom, stanjem i radnjama Promeni, Isključi, Ponovo poveži, Ukloni."],
  ["Veprime: veprimet e përditshme janë ndarë nga rikthimi dhe zona e rrezikut.","Actions: everyday actions are now separate from recovery and the danger zone.","Radnje: svakodnevne radnje su odvojene od povraćaja i opasne zone."],
  ["Log-u dhe Gabimet: rreshtat e gabimeve dhe kujdesit kanë ngjyrë dhe fjalë (GABIM, KUJDES).","Log and Errors: error and warning lines have a colour and a word (ERROR, WARNING).","Log i Greške: redovi grešaka i upozorenja imaju boju i reč (GREŠKA, UPOZORENJE)."],
  ["Cilësimet janë tani një buton i gjerë lart, poshtë logos.","Settings is now a wide button at the top, under the logo.","Podešavanja su sada široko dugme na vrhu, ispod logotipa."],
  ["Çinstalo HRSystem u zhvendos te fundi i faqes Veprime (Zona e rrezikut) dhe pyet dy herë.","Uninstall HRSystem moved to the bottom of the Actions page (Danger zone) and asks twice.","Deinstalacija HRSystem premeštena je na dno stranice Radnje (Opasna zona) i pita dvaput."],
  ["Përditësimi tregon tani si u krye: automatikisht (nata) ose manualisht (me buton), te Historiku, Veprimet e fundit, Log-u dhe njoftimi në telefon.","An update now shows how it ran: automatically (night) or manually (button), in History, Latest actions, Log and the phone message.","Ažuriranje sada pokazuje kako je izvršeno: automatski (noću) ili ručno (dugme), u Istoriji, Poslednjim radnjama, Logu i poruci na telefonu."],
  ["Njoftimet: zgjedh çfarë të vijë në telefon (aplikacioni, adresat, backup-et, disku, përditësimet, raporti i ditës); teksti u shkurtua.","Notifications: choose what reaches the phone (application, addresses, backups, disk, updates, daily report); the text was shortened.","Obaveštenja: biraš šta stiže na telefon (aplikacija, adrese, backup-ovi, disk, ažuriranja, dnevni izveštaj); tekst je skraćen."],
  ["Eksporto SQL: shkarkon një dump të databazës me një klikim (te Veprime › Databaza).","Export SQL: downloads a database dump in one click (Actions › Database).","Izvoz SQL: preuzima dump baze jednim klikom (Radnje › Baza)."],
  ["Cilësimet: kartë e re \"Kontakto Administratorin\" me WhatsApp dhe email.","Settings: a new \"Contact the Administrator\" card with WhatsApp and email.","Podešavanja: nova kartica \"Kontaktiraj administratora\" sa WhatsApp-om i emailom."],
  ["Butonat pa \"tani\" (Backup, Kopjo, Ndrysho, Dërgo raportin) dhe tekste më të shkurtra te Veprime.","Buttons without \"now\" (Backup, Copy, Change, Send the report) and shorter texts in Actions.","Dugmad bez \"sada\" (Backup, Kopiraj, Promeni, Pošalji izveštaj) i kraći tekstovi u Radnjama."],
  ["Kryesore: tekstet \"e fundit\", \"në 24 orë\" dhe \"dashboard-i dhe programi\" tani përkthehen edhe në anglisht e serbisht.","Home: the texts \"last\", \"in 24 hours\" and \"the dashboard and the program\" are now translated into English and Serbian too.","Početna: tekstovi \"poslednji\", \"u 24 sata\" i \"dashboard i program\" sada su prevedeni i na engleski i srpski."],
  ["Kryesore: \"Veprime të shpejta\" janë tani më lart, para kartave.","Home: \"Quick actions\" now sit higher, before the cards.","Početna: \"Brze radnje\" su sada više, ispred kartica."],
  ["Kryesore: adresat nuk dyfishohen më. Karta \"Lidhja\" ka adresat dhe veprimet (hiq domenin, ndrysho adresën ose tunelin), ndërsa poshtë shfaqen \"Veprimet e fundit\".","Home: addresses are no longer shown twice. The \"Connection\" card holds the addresses and actions (remove a domain, change the address or the tunnel), and \"Latest actions\" appears below.","Početna: adrese se više ne prikazuju dvaput. Kartica \"Veza\" ima adrese i radnje (ukloni domen, promeni adresu ili tunel), a ispod su \"Poslednje radnje\"."],
  ["Logoja e re e HRSystem në vend të katrorit \"HR\": te menuja, ekrani i ngarkimit, faqja e hyrjes dhe ikona e faqes.","The new HRSystem logo replaces the \"HR\" square: in the menu, the loading screen, the sign-in page and the page icon.","Novi HRSystem logotip zamenjuje kvadrat \"HR\": u meniju, na ekranu učitavanja, na stranici prijave i kao ikona stranice."],
  ["Kryesore ka opsione të reja: veprime të shpejta (backup, përditëso, log-u, historiku, gabimet, kopjo adresën, çfarë ka të re).","Home has new options: quick actions (backup, update, log, history, errors, copy the address, what is new).","Početna ima nove opcije: brze radnje (backup, ažuriranje, log, istorija, greške, kopiraj adresu, šta je novo)."],
  ["Kartat Databaza dhe Lidhja janë më të plota: emri, serveri, madhësia, backup i fundit; adresat, domeni dhe tuneli me gjendje.","The Database and Connection cards are fuller: name, server, size, last backup; addresses, domain and tunnel with status.","Kartice Baza i Veza su potpunije: ime, server, veličina, poslednji backup; adrese, domen i tunel sa stanjem."],
  ["Dizajn i ri: shkronja JetBrains Mono, kartat kanë ikona (CPU, databazë, lidhje, disk, version, backup) dhe faqja \"Pasqyra\" quhet \"Kryesore\".","New design: the JetBrains Mono font, cards with icons (CPU, database, connection, disk, version, backup), and the \"Overview\" page is now called \"Home\".","Novi dizajn: font JetBrains Mono, kartice sa ikonama (CPU, baza, veza, disk, verzija, backup), a stranica \"Pregled\" se sada zove \"Početna\"."],
  ["Kërkim me Ctrl + K: faqet, instalimet dhe veprimet e shpejta (hap aplikacionin, backup, përditëso, tema).","Search with Ctrl + K: pages, installations and quick actions (open the app, backup, update, theme).","Pretraga sa Ctrl + K: stranice, instalacije i brze radnje (otvori aplikaciju, backup, ažuriranje, tema)."],
  ["Ngjyra të njëjta për statuset kudo: online / sukses, offline / gabim, paralajmërim, duke u lidhur, joaktiv, në pritje, mirëmbajtje.","The same colours for statuses everywhere: online / success, offline / error, warning, connecting, inactive, waiting, maintenance.","Iste boje za statuse svuda: online / uspeh, offline / greška, upozorenje, povezivanje, neaktivno, na čekanju, održavanje."],
  ["Dashboard-i ka numër versioni dhe pas çdo përditësimi të vetes tregon çfarë ka të re, në faqe dhe në njoftimin në telefon.","The dashboard has a version number and, after each self-update, shows what is new, on the page and in the phone message.","Dashboard ima broj verzije i posle svakog samostalnog ažuriranja prikazuje šta je novo, na stranici i u poruci na telefonu."],
  ["Shënimet e versionit të programit (çfarë ka të re) shfaqen te Pasqyra para përditësimit dhe në njoftimin \"Ka version të ri\".","The program release notes (what is new) appear on Overview before the update and in the \"New version available\" message.","Beleške o verziji programa (šta je novo) prikazuju se na Pregledu pre ažuriranja i u poruci \"Ima nova verzija\"."],
  ["Njoftimi \"Përditësimi u krye\" i përsërit çfarë ka të re.","The \"Update finished\" message repeats what is new.","Poruka \"Ažuriranje je završeno\" ponavlja šta je novo."],
  ["Puna automatike e natës rinis kur ndërron orën (p.sh. nga 01:00 në 19:00), edhe nëse sot ka punuar tashmë; historiku tregon pse nuk u nis.","The automatic night job restarts when the hour is changed (e.g. from 01:00 to 19:00), even if it already ran today; the history says why it did not start.","Automatski noćni posao se ponovo pokreće kad se promeni sat (npr. sa 01:00 na 19:00), čak i ako je danas već radio; istorija kaže zašto nije pokrenut."],

  ["(kodi","(code","(kod"],
  ["Duhen leje administratori: dashboard-i duhet të punojë si administrator.","Administrator rights are needed: the dashboard must run as administrator.","Potrebna su administratorska prava: dashboard mora raditi kao administrator."],
  ["Versioni i instaluar:","Installed version:","Instalirana verzija:"],
  ["Programet e sistemit: shkarkimi dhe instalimi janë dy hapa; shkarkon tani dhe e instalon kur të duash.","Programs of the system: downloading and installing are two steps; download now and install when you want.","Programi sistema: preuzimanje i instalacija su dva koraka; preuzmi sada i instaliraj kada želiš."],
  ["Mund ta caktosh kohën e instalimit (nga 02:00 si parazgjedhje, por e zgjedh ti), ose të instalosh menjëherë.","You can set the time of the installation (02:00 by default, but you choose), or install at once.","Možeš zakazati vreme instalacije (podrazumevano 02:00, ali ti biraš) ili instalirati odmah."],
  ["Automatik: shkarkim i vetvetishëm i versioneve të reja (i ndezur) dhe instalim i vetvetishëm në orën që zgjedh ti (i fikur).","Automatic: self-downloading of new versions (on) and self-installing at the hour you choose (off).","Automatski: samostalno preuzimanje novih verzija (uključeno) i samostalna instalacija u sat koji ti izabereš (isključeno)."],
  ["Skedarët kontrollohen me SHA-256 para instalimit; Setup-i instalon Node.js të fundit të provuar me sistemin.","The files are checked with SHA-256 before installing; Setup installs the newest Node.js tested with the system.","Fajlovi se proveravaju SHA-256 pre instalacije; Setup instalira najnoviji Node.js testiran sa sistemom."],
  ["Instalo vetë pas shkarkimit, në orën","Install by itself after the download, at","Samostalno instaliraj posle preuzimanja, u"],
  ["Ora e instalimit automatik","Hour of the automatic installation","Sat automatske instalacije"],
  ["Shkarkimi vetë nuk ndryshon asgjë në kompjuter. Instalimi vetë bëhet vetëm kur e ndez këtu; ora është ajo që zgjedh ti (02:00 si parazgjedhje).","Downloading by itself changes nothing on the computer. Installing by itself happens only when you switch it on here; the hour is the one you choose (02:00 by default).","Samostalno preuzimanje ne menja ništa na računaru. Samostalna instalacija se dešava samo kada je ovde uključiš; sat je onaj koji ti izabereš (podrazumevano 02:00)."],
  ["Node.js ndez aplikacionin; cloudflared ndez tunelin. Shkarkimi dhe instalimi janë dy hapa: shkarkon tani dhe e instalon kur të duash (një kohë që e cakton ti, p.sh. natën).","Node.js runs the application; cloudflared runs the tunnel. Downloading and installing are two steps: download now and install when you want (a time you set, e.g. at night).","Node.js pokreće aplikaciju; cloudflared pokreće tunel. Preuzimanje i instalacija su dva koraka: preuzmi sada i instaliraj kada želiš (vreme koje ti odrediš, npr. noću)."],

  ["A je i sigurt? Instalimi niset menjëherë; hapat shihen te Log-u.","Are you sure? The installation starts at once; its steps are in Log.","Da li si siguran? Instalacija počinje odmah; koraci su u Logu."],

  ["Shkarkimi vetë nuk ndryshon asgjë në kompjuter. Instalimi vetë bëhet vetëm kur e ndez këtu; ora është ajo që zgjedh ti (02:00 si parazgjedhje).","Downloading by itself changes nothing on the computer. Installing by itself happens only when you switch it on here.","Samostalno preuzimanje ne menja ništa na računaru. Samostalna instalacija se dešava samo kada je ovde uključiš."],

  ["skedari i shkarkuar është ndryshuar ose dëmtuar; shkarkoje përsëri.","the downloaded file was changed or damaged; download it again.","preuzeti fajl je izmenjen ili oštećen; preuzmi ga ponovo."],
  ["Shkarko fillimisht versionin e ri.","Download the new version first.","Prvo preuzmi novu verziju."],
  ["Koha duhet të jetë nga 1 minutë deri në 14 ditë përpara.","The time must be from 1 minute to 14 days ahead.","Vreme mora biti od 1 minuta do 14 dana unapred."],
  ["U krye automatikisht në kohën e caktuar.","Done automatically at the set time.","Izvršeno automatski u zakazano vreme."],
  ["Veprime: karta e re \"Programet e sistemit\" tregon versionin e Node.js dhe të cloudflared (tunelit) dhe të rejat nga interneti.","Actions: the new card \"Programs of the system\" shows the version of Node.js and of cloudflared (the tunnel) and the newest ones from the internet.","Akcije: nova kartica \"Programi sistema\" prikazuje verziju Node.js i cloudflared (tunela) i najnovije sa interneta."],
  ["Mund t'i përditësosh me një buton (pyet dy herë; hapat shihen te Log-u). Node.js ndryshon vetëm brenda të njëjtit version të madh dhe kontrollohet me SHA-256; cloudflared përditësohet me winget.","You can update them with a button (it asks twice; the steps are in Log). Node.js changes only inside the same major version and is checked with SHA-256; cloudflared is updated with winget.","Možeš ih ažurirati dugmetom (pita dvaput; koraci su u Logu). Node.js se menja samo unutar iste glavne verzije i proverava se SHA-256; cloudflared se ažurira pomoću winget."],
  ["Rreshtat e Log-ut përkthehen sipas gjuhës së zgjedhur.","The lines of Log are translated into the chosen language.","Redovi Loga se prevode na izabrani jezik."],
  ["Programet e sistemit","Programs of the system","Programi sistema"],
  ["Faqja \"Çfarë ka të re\" u hoq nga dashboard-i: menuja, kartela te Kryesore, butonat te njoftimet dhe udhëzuesi.","The \"What is new\" page was removed from the dashboard: the menu, the card on Home, the buttons in the notices and the guide.","Stranica \"Šta je novo\" je uklonjena iz dashboarda: meni, kartica na početnoj, dugmad u obaveštenjima i uputstvo."],
  ["Udhëzuesi \"Si ta përdorësh\" u përditësua: Kryesore (veprime të shpejta, veprimet e fundit), Vendndodhja, Gabimet, Çfarë ka të re, zona e rrezikut dhe Eksporto SQL.","The guide \"How to use\" was updated: Home (quick actions, latest actions), Location, Errors, What's new, the danger zone and Export SQL.","Uputstvo \"Kako koristiti\" je ažurirano: Početna (brze akcije, poslednje akcije), Lokacija, Greške, Šta je novo, opasna zona i Izvezi SQL."],
  ["Programet e sistemit shpjegohen me dy hapat: Shkarko, pastaj Instalo tani ose Cakto kohën; plus shkarkimi dhe instalimi automatik.","The programs of the system are explained with the two steps: Download, then Install now or Set the time; plus the automatic download and install.","Programi sistema su objašnjeni sa dva koraka: Preuzmi, zatim Instaliraj sada ili Odredi vreme; plus automatsko preuzimanje i instalacija."],
  ["Te njoftimet shtohen raportet e gabimeve, dhe te problemet e zakonshme: raportimi kërkon programin 1.0.7 ose më të ri.","Bug reports are added to the notifications, and to the common problems: reporting needs the program 1.0.7 or newer.","Prijave grešaka su dodate obaveštenjima, a u česte probleme: prijavljivanje traži program 1.0.7 ili noviji."],
  ["Faqe e re \"Gabimet e raportuara\": raportet që punonjësit dërgojnë nga aplikacioni (Profili → Rreth Aplikacionit → Raporto një gabim) me emrin, rolin, pikën, telefonin dhe versionin.","New page \"Reported bugs\": the reports that staff send from the app (Profile → About the app → Report a bug) with the name, role, store, phone and version.","Nova stranica \"Prijavljene greške\": izveštaji koje osoblje šalje iz aplikacije (Profil → O aplikaciji → Prijavi grešku) sa imenom, ulogom, objektom, telefonom i verzijom."],
  ["Katër skeda: Të raportuara, Në përpunim, Të zgjidhura dhe Roadmap; çdo raport kalon nga një skedë te tjetra me një buton.","Four tabs: Reported, In progress, Solved and Roadmap; every report moves from one tab to another with a button.","Četiri kartice: Prijavljene, U obradi, Rešene i Roadmap; svaki izveštaj se prebacuje iz jedne kartice u drugu dugmetom."],
  ["Njoftim në telefon kur vjen raport i ri (ndahet me çelës te Njoftimet) dhe numër i kuq te menuja.","A phone message when a new report arrives (its own switch under Notifications) and a red number in the menu.","Poruka na telefon kada stigne nova prijava (poseban prekidač u Obaveštenjima) i crveni broj u meniju."],
  ["Node.js ndez aplikacionin; cloudflared ndez tunelin. Versionet e reja shfaqen këtu; përditësimi bëhet vetëm kur e shtyp.","Node.js runs the application; cloudflared runs the tunnel. New versions appear here; an update is done only when you press it.","Node.js pokreće aplikaciju; cloudflared pokreće tunel. Nove verzije se prikazuju ovde; ažuriranje se radi samo kada ga pritisneš."],

  tt.onclick = () => { tt.className = 'toast' + (err ? ' err' : ''); };
  if (store.get('toastStay', '0') !== '1') toastTimer = setTimeout(() => { tt.className = 'toast' + (err ? ' err' : ''); }, err ? 8000 : 4500);
}

// ---- polish: a button whose handler returns a promise shows a spinner (after 120 ms, so a quick action never flashes) and ignores a second click until it ends
(function () {
  const d = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'onclick');
  if (!d || !d.set) return;
  Object.defineProperty(HTMLButtonElement.prototype, 'onclick', {
    configurable: true,
    get() { return d.get.call(this); },
    set(fn) {
      if (typeof fn !== 'function') return d.set.call(this, fn);
      d.set.call(this, function (ev) {
        const b = this; b.classList.add('is-busy'); b.setAttribute('aria-busy', 'true'); // set before the handler runs, so a dialog opened by it can hide the spinner
        const end = () => { b.classList.remove('is-busy'); b.removeAttribute('aria-busy'); };
        let r;
        try { r = fn.call(this, ev); } catch (err) { end(); throw err; }
        if (r && typeof r.then === 'function') r.then(end, end); else end();
        return r;
      });
    },
  });
})();
// ---- polish: the browser's own boxes (confirm / prompt) become in-page dialogs. Same wording (translated), used with await. A question about something
// that deletes or replaces data is drawn in red. Escape or a click outside cancels; Enter confirms; Tab stays inside.
const DANGER_RE = /FSHIH|Fshij|Çinstaloj|Heq |Rikthej databazën|IMPORT I PLOTË|nuk kthehet|zëvendëson/i;
function openDialog({ message, input, value, placeholder }) {
  return new Promise((resolve) => {
    const prev = document.activeElement;
    const busyBtn = (prev && prev.classList && prev.classList.contains('is-busy') ? prev : null) || document.querySelector('button.is-busy'); if (busyBtn) busyBtn.classList.remove('is-busy'); // no spinner while the question is open
    const danger = DANGER_RE.test(String(message));
    const parts = String(message).split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
    const field = input ? el('input', { type: 'text', value: value || '', placeholder: placeholder || '', 'aria-label': parts[0] || 'Vlera', spellcheck: 'false', autocomplete: 'off' }) : null;
    const ok = el('button', { type: 'button', class: 'btn' + (danger ? ' danger-solid' : '') }, input ? 'Ruaj' : 'Vazhdo');
    const cancel = el('button', { type: 'button', class: 'btn ghost' }, 'Anulo');
    const panel = el('div', { class: 'dlg' + (danger ? ' danger' : ''), role: input ? 'dialog' : 'alertdialog', 'aria-modal': 'true', 'aria-label': parts[0] || 'HRSystem' },
      el('div', { class: 'dlg-icon', 'aria-hidden': 'true' }, icon(danger ? 'alert' : input ? 'pen' : 'help')),
      el('div', { class: 'dlg-body' }, ...parts.map((p) => el('p', {}, p)), field),
      el('div', { class: 'dlg-actions' }, cancel, ok));
    const overlay = el('div', { class: 'dlg-overlay' }, panel);
    let closed = false;
    const finish = (v) => {
      if (closed) return; closed = true;
      document.removeEventListener('keydown', onKey, true);
      overlay.classList.add('out'); setTimeout(() => overlay.remove(), 160);
      if (busyBtn && v && busyBtn.isConnected) busyBtn.classList.add('is-busy'); // the action goes on: the spinner returns
      if (prev && prev.focus) prev.focus();
      resolve(v);
    };
    const accept = () => finish(input ? field.value : true), reject = () => finish(input ? null : false);
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); reject(); }
      else if (e.key === 'Enter' && document.activeElement !== cancel) { e.preventDefault(); e.stopPropagation(); accept(); }
      else if (e.key === 'Tab') { const f = [field, cancel, ok].filter(Boolean), i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
    };
    ok.onclick = accept; cancel.onclick = reject;
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) reject(); });
    document.addEventListener('keydown', onKey, true);
    document.body.append(overlay);
    if (field) { field.focus(); field.select(); } else (danger ? cancel : ok).focus(); // a dangerous question starts on "Anulo"
  });
}
const confirmAsync = (message) => openDialog({ message });
const promptAsync = (message, value) => openDialog({ message, input: true, value });

// ---- polish: the loading screen leaves once the first status is drawn (or tells that the dashboard does not answer)
const bootEl = () => document.getElementById('boot');

function hideBoot() {
  const b = bootEl(); if (!b || b.classList.contains('done')) return;
  b.classList.add('done'); setTimeout(() => b.remove(), 400);
}
function bootFail(msg) {
  const b = bootEl(); if (!b || b.classList.contains('done')) return;
  b.classList.add('fail'); $('boottext').textContent = t(msg);
  if (!b.querySelector('button')) { const r = el('button', { type: 'button', class: 'btn' }, 'Provo përsëri'); r.onclick = () => { b.classList.remove('fail'); $('boottext').textContent = t('Po hapet dashboard-i...'); b.querySelector('button').remove(); load(); }; b.querySelector('.boot-in').append(r); }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = el('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); } catch { /* none */ } t.remove(); }
  toast('U kopjua.');
}

// ---- 2.3 building blocks shared by the pages
const raw = (v) => document.createTextNode(String(v)); // text that is never translated (names, versions, what people wrote)
// A table cell with its column name (shown beside the value when the table is stacked on a phone).
const td = (label, cls, ...kids) => el('td', { ...(label ? { 'data-l': t(label) } : {}), ...(cls ? { class: cls } : {}) }, ...kids);
const thead = (cols) => el('thead', {}, el('tr', {}, ...cols.map((c) => { const [label, cls] = Array.isArray(c) ? c : [c, '']; return el('th', { scope: 'col', ...(cls ? { class: cls } : {}) }, label || el('span', { class: 'sr' }, 'Veprime')); })));
// A notice: icon, bold title, a line of text, buttons. kind: '' (attention), 'run' (information), 'ok', 'bad'.
const banner = (kind, title, text, buttons, attrs = {}) => el('div', { class: 'banner' + (kind ? ' ' + kind : ''), ...attrs }, icon(kind === 'ok' ? 'check' : kind === 'run' ? 'info' : 'alert'),
  el('div', { class: 'btext' }, el('p', {}, el('b', {}, title), text ? ' ' : '', text || '')), buttons && buttons.length ? el('div', { class: 'row' }, ...buttons) : '');
// A window over the page (a sheet from the bottom on a phone): Escape or a click outside closes it, Tab stays inside, focus returns to where it was.
function openModal(title, ...kids) {
  const prev = document.activeElement, id = 'modal' + Date.now();
  const panel = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': id }, el('h2', { id }, title), ...kids);
  const overlay = el('div', { class: 'modal-overlay' }, panel);
  const close = () => { leave(overlay); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); };
  const onKey = (e) => {
    if (e.key === 'Escape') { close(); return; }
    if (e.key === 'Tab') {
      const f = [...panel.querySelectorAll('button, a[href], input')].filter((x) => !x.disabled);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  overlay.onmousedown = (e) => { if (e.target === overlay) close(); };
  document.addEventListener('keydown', onKey);
  document.body.append(overlay);
  const first = panel.querySelector('button'); if (first) first.focus();
  return { close, panel };
}

        '[[Qasja]]: kontrast i lartë, pa animacione, ngjyra të sigurta për verbëri ngjyrash, butona më të mëdhenj, fokus më i dukshëm, ndalim i përditësimit automatik.',
        '[[Siguria]]: fjalëkalimi i dashboard-it është opsional; vendose nëse kompjuterin e përdorin disa persona. E harrove? Fshi skedarin manager\\dashboard.key.',
        '[[Rivendos]] i kthen zgjedhjet e pamjes dhe të qasjes si në fillim.',
        '[[Kontakto Administratorin]]: WhatsApp dhe email për ndihmë.',

      { id: 'red', title: 'Kur diçka është e kuqe', items: [
        'Programi del [[Fikur]]: shtyp [[Start]] te Kryesore. Nëse bie përsëri, hap [[Gabimet]] › [[Aplikacioni]] dhe dërgo diagnostikën.',

        'Njoftimet nuk vijnë: emri i temës duhet të jetë i njëjtë në telefon dhe në dashboard; pastaj [[Dërgo provë]].',
