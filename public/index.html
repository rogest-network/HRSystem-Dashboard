<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRSystem Dashboard</title>
<style>
  :root {
    --bg:#f3f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --soft:#f1f5f9;
    --accent:#4f46e5; --accent-soft:#eef2ff; --accent-text:#ffffff;
    --ok:#047857; --okbg:#d1fae5; --warn:#92400e; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2;
    --side:#0f172a; --side-2:#1e293b; --side-text:#cbd5e1; --side-muted:#64748b;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
    --font:"Cascadia Mono", "JetBrains Mono", "SF Mono", Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0b1020; --card:#131a2e; --text:#e5e9f4; --muted:#8b97b1; --line:#222c47; --soft:#18213a;
    --accent:#818cf8; --accent-soft:#1d2447; --accent-text:#0b1020;
    --ok:#34d399; --okbg:#0d3a2e; --warn:#fbbf24; --warnbg:#3a2c0a; --bad:#f87171; --badbg:#3f1519;
    --side:#070b17; --side-2:#111936; --side-text:#c3cbe0; --side-muted:#6b7794;
    --shadow:none;
  } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.55 var(--font); -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font-family:var(--font); }
  a { color:var(--accent); text-decoration:none; word-break:break-all; } a:hover { text-decoration:underline; }
  .app { display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; }

  /* --- side navbar */
  .side { background:var(--side); color:var(--side-text); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding:18px 12px; gap:6px; }
  .brand { display:flex; align-items:center; gap:10px; padding:2px 10px 14px; }
  .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#6366f1,#4338ca); display:grid; place-items:center; color:#fff; font-weight:800; letter-spacing:-.5px; }
  .brand b { display:block; color:#fff; font-size:15px; letter-spacing:.2px; } .brand span { font-size:11.5px; color:var(--side-muted); }
  .inst { margin:0 6px 10px; padding:9px 10px; background:var(--side-2); border-radius:10px; display:flex; align-items:center; gap:9px; }
  .inst select { background:transparent; border:0; color:#fff; font:inherit; font-weight:600; width:100%; outline:none; }
  .inst select option { color:#0f172a; }
  .dot { width:9px; height:9px; border-radius:50%; background:#64748b; flex:none; } .dot.on { background:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,.18); } .dot.off { background:#f87171; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; align-items:center; gap:11px; width:100%; background:transparent; border:0; color:var(--side-text); padding:9px 12px; border-radius:9px; font:inherit; font-weight:500; cursor:pointer; text-align:left; }
  .nav button:hover { background:var(--side-2); color:#fff; }
  .nav button.on { background:var(--accent); color:var(--accent-text); font-weight:600; }
  .nav button svg { flex:none; opacity:.9; }
  .nav .count { margin-left:auto; font-size:11px; background:rgba(255,255,255,.12); padding:1px 8px; border-radius:99px; }
  .nav .grow { flex:1; }
  .side .foot { margin-top:auto; padding:10px 10px 0; border-top:1px solid var(--side-2); font-size:12px; color:var(--side-muted); display:grid; gap:8px; }
  .side .foot button { background:transparent; border:1px solid var(--side-2); color:var(--side-text); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  .side .foot button:hover { background:var(--side-2); }
  .side .foot button.danger { color:#fca5a5; border-color:#4c1d24; } .side .foot button.danger:hover { background:#3f1519; }

  /* --- main */
  .main { padding:24px 32px 16px; min-width:0; display:flex; flex-direction:column; min-height:100vh; }
  .page { max-width:1500px; width:100%; margin:0 auto; }
  .credit { margin-top:auto; padding-top:28px; text-align:right; color:var(--muted); font-size:11.5px; letter-spacing:.4px; }
  .credit b { color:var(--text); font-weight:600; }
  .top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .top h1 { font-size:22px; margin:0; letter-spacing:-.2px; } .top p { margin:2px 0 0; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button.btn { font:inherit; font-weight:600; color:var(--accent-text); background:var(--accent); border:1px solid transparent; border-radius:9px; padding:8px 15px; cursor:pointer; box-shadow:var(--shadow); }
  button.btn:hover { filter:brightness(1.07); }
  button.btn.ghost { background:var(--card); color:var(--text); border-color:var(--line); }
  button.btn.ghost:hover { background:var(--soft); }
  button.btn.danger { background:var(--card); color:var(--bad); border-color:var(--bad); }
  button.btn.sm { padding:3px 10px; font-size:12.5px; font-weight:500; border-radius:7px; }
  button:disabled { opacity:.5; cursor:default; filter:none; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; }
  .pill.ok { background:var(--okbg); color:var(--ok); } .pill.warn { background:var(--warnbg); color:var(--warn); } .pill.bad { background:var(--badbg); color:var(--bad); } .pill.mute { background:var(--soft); color:var(--muted); }

  .kpis { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin-bottom:16px; }
  .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; margin-bottom:16px; }
  .grid3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; margin-bottom:16px; }
  @media (max-width:1280px) { .kpis { grid-template-columns:repeat(2, minmax(0,1fr)); } .grid3 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px; }
  .kpis .card, .grid2 .card, .grid3 .card { margin-bottom:0; }
  .card h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700; }
  .card h2 small { text-transform:none; letter-spacing:0; font-weight:400; margin-left:6px; }
  .kpi .v { font-size:20px; font-weight:700; letter-spacing:-.4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .kpi .s { color:var(--muted); font-size:12.5px; margin-top:4px; word-break:break-all; }
  .spark { display:flex; align-items:flex-end; gap:2px; height:26px; margin-top:10px; }
  .spark i { flex:1; min-width:2px; background:var(--accent); border-radius:2px 2px 0 0; opacity:.65; }
  .spark i.down { background:var(--bad); height:100% !important; opacity:.5; }

  table.kv { width:100%; border-collapse:collapse; }
  table.kv td { padding:9px 4px; border-top:1px solid var(--line); vertical-align:middle; }
  table.kv tr:first-child td { border-top:0; }
  table.kv td.k { width:34%; color:var(--muted); white-space:nowrap; padding-right:14px; }
  table.kv td.a { text-align:right; white-space:nowrap; width:1%; }
  code, .mono { font:12.5px/1.4 var(--font); }
  .val { display:inline-block; max-width:100%; background:var(--soft); border:1px solid var(--line); border-radius:7px; padding:3px 9px; word-break:break-all; }
  .val.secret { letter-spacing:1px; }
  .iconbtn { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:3px 8px; font:inherit; font-size:12px; cursor:pointer; margin-left:4px; }
  .iconbtn:hover { color:var(--text); background:var(--soft); }
  .desc { color:var(--muted); font-size:13px; margin:-4px 0 12px; }
  .act { display:flex; flex-direction:column; gap:10px; }
  .act .item { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 14px; border:1px solid var(--line); border-radius:11px; background:var(--soft); }
  .act .item b { display:block; font-weight:600; } .act .item span { color:var(--muted); font-size:12.5px; }
  .banner { border:1px solid var(--warn); background:var(--warnbg); color:var(--text); border-radius:12px; padding:14px 18px; margin-bottom:16px; display:grid; gap:10px; }
  .banner p { margin:0; }
  .banner.ok { border-color:var(--ok); background:var(--okbg); } .banner.bad { border-color:var(--bad); background:var(--badbg); }
  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 2px; border-top:1px solid var(--line); }
  ul.list li:first-child { border-top:0; }
  ul.list .p { min-width:0; } ul.list .p b { display:block; font-weight:600; } ul.list .p span { color:var(--muted); font-size:12.5px; word-break:break-all; }
  ul.list li.missing .p span { color:var(--bad); }
  pre.log { margin:0; max-height:520px; overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font:12.5px/1.5 var(--font); white-space:pre-wrap; word-break:break-word; }
  .empty { color:var(--muted); padding:16px 2px; }
  .toast { position:fixed; right:22px; bottom:22px; max-width:520px; background:var(--side); color:#fff; padding:12px 16px; border-radius:11px; box-shadow:0 10px 30px rgba(0,0,0,.25); font-size:13.5px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; transform:none; } .toast.err { background:#991b1b; }

  /* --- polish (22.10.2026): domains stay on one line, the address card gets the wider column, softer details */
  a.dom { word-break:normal; overflow-wrap:normal; white-space:nowrap; font-weight:600; }
  table.kv td.k { width:1%; padding-right:28px; }
  table.kv td { padding:11px 6px; }
  table.kv tr { transition:background .15s; }
  table.kv tr:hover td { background:var(--soft); }
  .grid2.wide { grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); }
  .kpi .s { overflow-wrap:anywhere; word-break:normal; }
  .kpi .v { font-variant-numeric:tabular-nums; }
  .top h1 { font-size:24px; letter-spacing:-.4px; }
  .card { transition:border-color .15s, box-shadow .15s; } .card:hover { border-color:color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .act .item { transition:border-color .15s; } .act .item:hover { border-color:var(--accent); }
  button, a, .iconbtn { transition:background .15s, filter .15s, border-color .15s, color .15s; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  ::selection { background:var(--accent); color:var(--accent-text); }
  @media (max-width:1180px) { .grid2.wide { grid-template-columns:1fr; } }
  @media (max-width:700px) { a.dom { white-space:normal; word-break:break-all; } table.kv td.k { width:auto; white-space:normal; } table.kv td.a { white-space:normal; } }

  @media (max-width:980px) {
    .app { grid-template-columns:1fr; } .side { position:static; height:auto; flex-direction:column; }
    .nav { flex-direction:row; flex-wrap:wrap; } .nav button { width:auto; } .main { padding:16px; }
    .kpis, .grid2, .grid3 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="page" id="page"></div><footer class="credit">Krijuar nga <b>Rogest Network</b></footer></main>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY = '__KEY__';
// The key of this page is new on every start of the dashboard (it also restarts itself after an update): a request with the old key answers
// 403 "forbidden". The page then reloads itself once to get the new key, instead of showing "forbidden" on every button.
(() => {
  const plainFetch = window.fetch.bind(window);
  window.fetch = async (...args) => {
    const res = await plainFetch(...args);
    if (res.status === 403 && String(args[0]).startsWith('/api/') && !window.__reloading) {
      const j = await res.clone().json().catch(() => ({}));
      if (j.error === 'forbidden') { window.__reloading = true; const t = document.getElementById('toast'); if (t) { t.textContent = 'Dashboard-i u rinis: po rifreskohet...'; t.className = 'toast show'; } setTimeout(() => location.reload(), 1200); }
    }
    return res;
  };
})();
const NL = String.fromCharCode(10);
const $ = (id) => document.getElementById(id);
const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
// 24-hour clock everywhere (dd.mm.yyyy HH:MM[:SS]); built by hand so the browser's language settings cannot bring back AM/PM.
const two = (n) => String(n).padStart(2, '0');
const fmtTime = (s, secs) => { const d = new Date(s); return isNaN(d) ? '-' : two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()) + (secs ? ':' + two(d.getSeconds()) : ''); };
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* private window */ } } };

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === 'class') n.className = v; else if (k.startsWith('on')) n[k] = v; else n.setAttribute(k, v); }
  for (const kid of kids) if (kid !== null && kid !== undefined && kid !== false) n.append(kid);
  return n;
}
const pill = (cls, text) => el('span', { class: 'pill ' + cls }, text);
const speedClass = (ms) => ms < 400 ? 'ok' : ms < 1200 ? 'warn' : 'bad';

// Small line icons (24x24).
const ICONS = {
  home: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18',
  key: 'M14 10a4 4 0 1 1-3.5 6L4 22v-3H2v-2h3l5.5-5.5A4 4 0 0 1 14 10zM15.5 8.5h.01',
  bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
  box: 'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',
  folder: 'M3 6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z',
  term: 'M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM7 10l3 2-3 2M12 15h5',
};
const icon = (name) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', '18'); s.setAttribute('height', '18'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '1.8'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', ICONS[name]); s.append(p); return s; };

let toastTimer = null;
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast' + (err ? ' err' : ''); }, err ? 8000 : 4500);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = el('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); } catch { /* none */ } t.remove(); }
  toast('U kopjua.');
}

const SECTIONS = [['home', 'Pasqyra', 'home'], ['access', 'Adresat', 'globe'], ['data', 'Të dhënat', 'key'], ['actions', 'Veprime', 'bolt'], ['backup', 'Backup-et', 'box'], ['files', 'Ku është instaluar', 'folder'], ['log', 'Log-u', 'term']];
const state = { cur: store.get('cur', ''), section: store.get('section', 'home'), data: null, secrets: {}, shown: {}, jobStates: {}, dismissed: 0 };
const running = () => (state.data ? state.data.instances.filter((i) => i.job && i.job.state === 'running').map((i) => i.id) : []);

// ---------------------------------------------------------------- one installation
function view(s) {
  const h = s.health, a = s.access;
  const busy = !!(s.job && s.job.state === 'running');
  const post = (path, extra = '') => fetch('/api/' + path + '?id=' + encodeURIComponent(s.id) + extra, { method: 'POST', headers: { 'X-Manager-Key': KEY } });
  const postJson = (path, body) => fetch('/api/' + path + '?id=' + encodeURIComponent(s.id), { method: 'POST', headers: { 'X-Manager-Key': KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const call = async (path, extra, okMsg) => {
    try { const r = await post(path, extra); const j = await r.json(); if (!r.ok) throw new Error(j.error === 'not_found' ? 'Dashboard-i punon ende me kodin e vjetër: rinise (Dashboard.bat ose rinis PC-në).' : (j.error || 'Gabim')); if (okMsg) toast(okMsg); return j; }
    catch (e) { toast('GABIM: ' + e.message, true); return null; }
  };
  const fileButton = (label, accept, onFile, cls = 'btn ghost') => {
    const input = el('input', { type: 'file', accept, style: 'display:none' });
    const b = el('button', { type: 'button', class: cls }, label);
    b.disabled = busy;
    b.onclick = () => input.click();
    input.onchange = async () => { const f = input.files[0]; if (f) await onFile(f); input.value = ''; };
    return [b, input];
  };
  const sendFile = async (path, f, started) => {
    try {
      const r = await fetch('/api/' + path + '?id=' + encodeURIComponent(s.id) + '&name=' + encodeURIComponent(f.name), { method: 'POST', headers: { 'X-Manager-Key': KEY }, body: await f.arrayBuffer() });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Gabim');
      go('log'); toast(started); load();
    } catch (e) { toast('GABIM: ' + e.message, true); }
  };

  const publicUrl = a.domain || '';
  const mainUrl = publicUrl || a.local;
  const inst = s.installed, lat = s.latest;
  const verText = !inst ? '-' : inst.error ? inst.error : inst.name;
  const latText = !lat ? '-' : lat.error ? lat.error : lat.version + (lat.prerelease ? ' (pre-release)' : '');
  const updPill = s.update === 'version' ? pill('warn', 'Ka version të ri') : s.update === 'build' ? pill('warn', 'Ka build të ri') : inst && !inst.error && lat && !lat.error ? pill('ok', 'I përditësuar') : null;

  const sysBtn = (label, action, ask, cls = 'btn ghost') => {
    const b = el('button', { type: 'button', class: cls }, label);
    b.disabled = busy;
    b.onclick = async () => {
      if (ask && !confirm(ask)) return;
      b.disabled = true; toast(label + '...');
      await call('system', '&do=' + action, label + ': u krye.');
      setTimeout(load, 4000);
    };
    return b;
  };
  const openBtn = el('button', { type: 'button', class: 'btn' }, 'Hap aplikacionin');
  openBtn.onclick = () => window.open(mainUrl, '_blank');
  // /developer opens already unlocked (the dashboard sends the SETUP_TOKEN from .env); the window is opened first so the browser does not block it.
  const devBtn = el('button', { type: 'button', class: 'btn ghost' }, 'Hap /developer');
  devBtn.disabled = !s.local;
  devBtn.onclick = async () => {
    const w = window.open('', '_blank');
    const j = await call('developer-open');
    if (j && w) w.location = j.url; else if (w) w.close();
  };
  const controls = el('div', { class: 'row' }, openBtn, devBtn, sysBtn('Stop', 'stop', 'Ndaloj aplikacionin? Përdoruesit nuk do ta hapin deri sa ta nisësh.'), sysBtn('Start', 'start'), sysBtn('Restart', 'restart', 'Rinis aplikacionin? Mund të mos hapet për disa sekonda.'));
  const header = (title, sub, extra) => el('div', { class: 'top' }, el('div', {}, el('h1', {}, title), el('p', {}, sub)), extra || '');

  const [importBtn, importInput] = fileButton('Importo databazën...', '.sql', async (f) => {
    const text = ['IMPORT I PLOTË në "' + s.name + '":', '- bëhet backup automatik;', '- FSHIHEN të gjitha tabelat që ekzistojnë tani;', '- ngarkohet "' + f.name + '" (' + fmtSize(f.size) + ');', '- ekzekutohen migrimet që mungojnë.', '', 'Vazhdoj?'].join(NL);
    if (confirm(text)) await sendFile('import', f, 'Importi filloi...');
  });
  const ownerBanner = () => {
    const setupBtn = el('button', { type: 'button', class: 'btn' }, 'Krijo pronarin (/setup)');
    setupBtn.onclick = async () => { const j = await call('setup-link'); if (j) window.open(j.url, '_blank'); };
    return el('div', { class: 'banner' },
      el('p', {}, el('b', {}, 'Instalim i ri: pronari ende nuk është krijuar.')),
      el('p', {}, 'Zgjidh një nga dy rrugët: (1) krijo pronarin e ri me /setup, ose (2) importo fillimisht databazën e vjetër dhe pastaj hap hyrjen (login) me përdoruesit e saj. Mos bëj të dyja.'),
      el('div', { class: 'row' }, setupBtn, importBtn, importInput));
  };

  // ---- addresses (shared by "Pasqyra" and "Adresat")
  const quickBtn = el('button', { type: 'button', class: 'btn ghost sm' }, a.quickUrl ? 'Ndale' : 'Krijo');
  quickBtn.onclick = async () => {
    quickBtn.disabled = true;

    return b;
  }));
  const refresh = el('button', { type: 'button' }, 'Rifresko'); refresh.onclick = load;
  const un = v.uninstall ? el('button', { type: 'button', class: 'danger' }, 'Çinstalo HRSystem...') : '';
  if (un) un.onclick = v.uninstall;
  side.replaceChildren(
    el('div', { class: 'brand' }, el('div', { class: 'logo' }, 'HR'), el('div', {}, el('b', {}, 'HRSystem'), el('span', {}, 'Dashboard'))),
    el('div', { class: 'inst' }, el('span', { class: 'dot ' + (s.health.ok ? 'on' : 'off') }), select),
    nav,
    el('div', { class: 'foot' }, j.dashboard && j.dashboard.files ? (() => { const b = el('button', { type: 'button' }, 'Dashboard i ri: përditëso'); b.onclick = () => go('actions'); return b; })() : '', el('span', {}, j.at ? 'Përditësuar ' + fmtTime(j.at, true) : ''), el('span', {}, 'Rifreskohet vetë çdo 30 s'), refresh, un));
  // The result of the last job stays on top for 15 minutes (until it is closed), so a finished update is never missed.
  const job = s.job;
  let done = '';
  if (job && job.state !== 'running' && job.ended && Date.now() - job.ended < 900000 && state.dismissed !== job.ended) {
    const ok = job.state === 'ok';
    const close = el('button', { type: 'button', class: 'iconbtn' }, 'Mbyll'); close.onclick = () => { state.dismissed = job.ended; render(); };
    const see = el('button', { type: 'button', class: 'iconbtn' }, 'Shiko log-un'); see.onclick = () => go('log');
    done = el('div', { class: 'banner ' + (ok ? 'ok' : 'bad') },
      el('p', {}, el('b', {}, (ok ? '✓ ' : '✗ ') + jobName(job.title) + (ok ? ' u krye me sukses' : ' dështoi')), ' · ' + fmtTime(job.ended, true) + (ok && s.installed && s.installed.name ? ' · versioni tani: ' + s.installed.name : '')),
      el('div', { class: 'row' }, see, close));
  }
  page.replaceChildren(...(done ? [done] : []), v.html);
}

// One status request at a time (a slow measurement must not pile up), and background refreshes stay silent when the dashboard is briefly unreachable (e.g. while it restarts itself).
const jobName = (t) => ({ Perditesim: 'Përditësimi i aplikacionit', 'Cloudflare Tunnel': 'Lidhja e tunelit', 'Heqja e tunelit': 'Heqja e tunelit' }[t] || t);
let loading = false, again = false;
async function load(quiet) {
  if (loading) { if (quiet !== true) again = true; return; }
  loading = true;
  try {
    const r = await fetch('/api/status');
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Gabim');
    state.data = j;
    // A job (update, SQL, import, tunnel) that was running and has ended now: say so at once.
    for (const i of j.instances) {
      const prev = state.jobStates[i.id], cur = i.job && i.job.state;
      if (prev === 'running' && cur && cur !== 'running') toast(cur === 'ok' ? '✓ ' + jobName(i.job.title) + ' u krye me sukses.' : '✗ ' + jobName(i.job.title) + ' dështoi: shiko Log-un.', cur !== 'ok');
      state.jobStates[i.id] = cur;
    }
    render();
  } catch (e) { if (quiet !== true) toast('GABIM: ' + e.message, true); }
  finally { loading = false; if (again) { again = false; load(); } }
}
load();
// Refresh every 30 s, but not while the tab is hidden; coming back to the tab refreshes at once.
setInterval(() => { if (!document.hidden && !running().length) load(true); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !running().length) load(true); });
// While an update / SQL / import / tunnel runs, only its log is refreshed (every 3 s); a full refresh would measure everything again.
setInterval(async () => {
  for (const id of running()) {
    try {
      const j = await (await fetch('/api/job?id=' + encodeURIComponent(id))).json();
      if (!j) continue;
      if (j.state !== 'running') { load(); return; }
      const pre = document.querySelector('pre.log[data-id="' + id + '"]');
      if (pre) { pre.textContent = j.lines.join(NL) || '...'; pre.scrollTop = pre.scrollHeight; }
    } catch { /* next round */ }
  }
}, 3000);
</script>
</body>
