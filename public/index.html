<style>

  live.addEventListener('pulse', (e) => { liveOn = true; liveAt = Date.now(); try { applyPulse(JSON.parse(e.data)); } catch { /* bad pulse */ } liveBadge(); });
  live.addEventListener('changed', () => load(true));
}
// What counts as a change: everything except the speed samples, the log lines and the clock.
function stateSig(j) {
  return JSON.stringify({ d: j.dashboard, i: j.instances.map((i) => ({ ...i, health: { ok: i.health.ok, database: i.health.database, status: i.health.status }, system: i.system && { d: i.system.disk && i.system.disk.data && Math.round(i.system.disk.data.free / 1073741824), a: i.system.appSince }, usage: i.usage && Math.round(i.usage.total / 10485760), job: i.job ? { s: i.job.state, e: i.job.ended, t: i.job.title } : null })), x: j.security });
}
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if (state.pendingRender && !(a && /^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName))) { state.pendingRender = false; const y = window.scrollY; render(); window.scrollTo(0, y); }
}, 300));
let loading = false, again = false;
async function load(quiet) {
  if (loading) { if (quiet !== true) again = true; return; }
  loading = true;
  try {
    const r = await fetch('/api/status');
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Gabim');
    state.data = j;
    // Quiet refresh (every 30 s): if nothing meaningful changed (the speed, the clock and the log do not count) the page is NOT redrawn, so reading,
    // scrolling and an open list are never interrupted; a change while a field or list is in use waits until it is released.
    const sig = stateSig(j), same = state.sig === sig; state.sig = sig;
    if (quiet === true && same) { if (state.repaint) state.repaint(); return; }
    // A job (update, SQL, import, tunnel) that was running and has ended now: say so at once.
    for (const i of j.instances) {
      const prev = state.jobStates[i.id], cur = i.job && i.job.state;
      if (prev === 'running' && cur && cur !== 'running') toast(cur === 'ok' ? jobName(i.job.title) + ' u krye.' : jobName(i.job.title) + ' dështoi: shiko Log-un.', cur !== 'ok');
      state.jobStates[i.id] = cur;
    }
    const busyField = quiet === true && document.activeElement && /^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (busyField) { state.pendingRender = true; return; }
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  } catch (e) { if (quiet !== true) toast('GABIM: ' + e.message, true); }
  finally { loading = false; if (again) { again = false; load(); } }
}
load();
startLive();
// Refresh every 30 s, but not while the tab is hidden; coming back to the tab refreshes at once.
setInterval(() => { if (!paused() && !document.hidden && !running().length) load(true); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !running().length) load(true); });
// While an update / SQL / import / tunnel runs, only its log is refreshed (every 3 s); a full refresh would measure everything again.
setInterval(async () => {
  if (liveFresh()) return; // the live pulse already brings the job
  for (const id of running()) {
    try {
      const j = await (await fetch('/api/job?id=' + encodeURIComponent(id))).json();
      if (!j) continue;
      if (j.state !== 'running') { load(); return; }
      const pre = document.querySelector('pre.log[data-id="' + id + '"]');
      paintBar(j);
      if (pre) { pre.textContent = j.lines.join(NL) || '...'; pre.scrollTop = pre.scrollHeight; }
    } catch { /* next round */ }
  }
}, 3000);
</script>
