  /* --- polish v3 (2026-10-22): the type Claude uses, app-like fields, calm warnings, a loading screen, and motion by the book

  /* fields: one size, one radius, a clear hover and a soft focus ring */

  }

  select { padding-right:34px; appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position:calc(100% - 17px) 15px, calc(100% - 12px) 15px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }
  .inst select { height:auto; padding:0 18px 0 0; border:0; background-color:transparent; box-shadow:none; border-radius:0; background-position:calc(100% - 6px) 7px, calc(100% - 1px) 7px; }
  .inst select:focus { box-shadow:none; }

  input[type=checkbox], input[type=radio] { accent-color:var(--accent); }

  button.btn, .iconbtn, .nav button, .gearbtn, .side .foot button, .gear { transition:background-color .15s, border-color .15s, color .15s, filter .15s, box-shadow .15s, transform .14s var(--ease-out); }
  button:not(:disabled):active, .gear:active { transform:scale(.97); }

  button.btn { box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 1px 2px rgba(15,23,42,.14); }

  /* warnings: an icon, a calm tinted surface and a coloured edge instead of a hard frame */

  .banner.ok { border-color:color-mix(in srgb, var(--ok) 28%, transparent); border-left-color:var(--ok); background:var(--okbg); } .banner.ok::before { content:"✓"; background:var(--ok); color:var(--okbg); }

  /* --- v1.2 (2026-10-23): JetBrains Mono, one set of status colours, icon cards, the Ctrl+K search */
  :root {
    --font:"JetBrains Mono", ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Courier New", monospace;
    --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Courier New", monospace;

    --st-ok:#27D796; --st-bad:#F05252; --st-warn:#F5B942; --st-info:#3478F6; --st-off:#737B8C; --st-pend:#A78BFA; --st-maint:#FB923C;

    --t-ok:#0b7f58; --t-bad:#c42424; --t-warn:#8a5a00; --t-info:#1d5bd0; --t-off:#5b6475; --t-pend:#6a4bd6; --t-maint:#b34d09;
  }

    --bad:var(--t-bad); --badbg:color-mix(in srgb, var(--st-bad) 13%, transparent);
  }
  body { font-size:13px; font-feature-settings:normal; letter-spacing:0; }
  button, input, select, textarea { font-family:var(--font); }
  button.btn { font-size:12.5px; } .nav button { font-size:12.5px; } .pill { font-size:11px; }
  .top h1 { font-size:20px !important; letter-spacing:-.02em; }
  .kpi .v { font-size:19px !important; }
  table.kv td, table.kv td.k { font-size:12.5px !important; }
  .card h2 { font-size:10.5px; letter-spacing:.08em; }

  /* status badges, dots, banners, bars */
  .pill.ok { background:var(--okbg); color:var(--ok); } .pill.warn { background:var(--warnbg); color:var(--warn); } .pill.bad { background:var(--badbg); color:var(--bad); }
  .pill.info { background:color-mix(in srgb, var(--st-info) 14%, transparent); color:var(--t-info); }
  .pill.pend { background:color-mix(in srgb, var(--st-pend) 16%, transparent); color:var(--t-pend); }
  .pill.maint { background:color-mix(in srgb, var(--st-maint) 15%, transparent); color:var(--t-maint); }
  .pill.mute { background:color-mix(in srgb, var(--st-off) 15%, transparent); color:var(--t-off); }
  .pill.ok::before, .pill.warn::before, .pill.bad::before, .pill.info::before, .pill.pend::before, .pill.maint::before, .pill.mute::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .dot { background:var(--st-off); } .dot.on { background:var(--st-ok); box-shadow:none; } .dot.off { background:var(--st-bad); }
  .live i { background:var(--st-ok); box-shadow:none; animation:none; } .live.off i { background:var(--st-bad); } .live.off { color:var(--t-bad); }
  .banner { border-color:color-mix(in srgb, var(--st-warn) 55%, transparent); background:color-mix(in srgb, var(--st-warn) 12%, transparent); }
  .banner.ok { border-color:color-mix(in srgb, var(--st-ok) 55%, transparent); background:color-mix(in srgb, var(--st-ok) 11%, transparent); }
  .banner.bad { border-color:color-mix(in srgb, var(--st-bad) 55%, transparent); background:color-mix(in srgb, var(--st-bad) 11%, transparent); }
  .banner.run { border-color:color-mix(in srgb, var(--st-info) 55%, transparent); background:color-mix(in srgb, var(--st-info) 11%, transparent); }
  .progress i { background:var(--st-info); }
  .spark i { background:var(--st-info); } .spark i.down { background:var(--st-bad); }
  .toast.err { background:#b42323; }
  button.btn.danger { color:var(--bad); border-color:color-mix(in srgb, var(--st-bad) 60%, transparent); }
  ul.list li.missing .p span, .errline { color:var(--bad); }

  /* cards with an icon */
  .kpis { grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); }
  .kh { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .kh h2 { margin:0 !important; flex:1; min-width:0; }
  .kic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none; background:color-mix(in srgb, var(--c, var(--st-off)) 15%, transparent); color:var(--ct, var(--t-off)); }
  .kic svg { width:16px; height:16px; }
  .kic.ok { --c:var(--st-ok); --ct:var(--t-ok); } .kic.bad { --c:var(--st-bad); --ct:var(--t-bad); } .kic.warn { --c:var(--st-warn); --ct:var(--t-warn); }
  .kic.info { --c:var(--st-info); --ct:var(--t-info); } .kic.pend { --c:var(--st-pend); --ct:var(--t-pend); } .kic.maint { --c:var(--st-maint); --ct:var(--t-maint); }
  .kic.off { --c:var(--st-off); --ct:var(--t-off); }
  .card.kpi { padding:16px 18px; } .card.kpi .v { margin-top:2px; }
  .card { border-radius:14px; }

  /* the search button in the side menu and the Ctrl+K window */
  .kbtn { display:flex; align-items:center; gap:9px; width:calc(100% - 12px); margin:0 6px 10px; padding:8px 10px; border-radius:9px; border:1px solid var(--side-2); background:rgba(255,255,255,.04); color:var(--side-muted); font:inherit; font-size:12px; cursor:pointer; text-align:left; }
  .kbtn:hover { background:rgba(255,255,255,.08); color:#fff; } .kbtn svg { flex:none; opacity:.85; } .kbtn span { flex:1; }
  kbd { font:600 10.5px var(--mono); padding:2px 6px; border-radius:5px; border:1px solid color-mix(in srgb, currentColor 30%, transparent); background:color-mix(in srgb, currentColor 8%, transparent); }
  .cmdk-overlay { position:fixed; inset:0; z-index:80; background:rgba(2,6,23,.55); display:grid; justify-items:center; align-items:start; padding:12vh 16px 16px; }
  .cmdk { width:min(580px,100%); background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.35); overflow:hidden; animation:cmdkin .16s cubic-bezier(.23,1,.32,1); }
  @keyframes cmdkin { from { opacity:0; transform:translateY(-6px) scale(.985); } }
  .cmdk .in { display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--line); color:var(--muted); }
  .cmdk .in input { flex:1; height:50px !important; border:0 !important; box-shadow:none !important; background:transparent !important; padding:0 !important; font-size:14px !important; color:var(--text); border-radius:0 !important; }
  .cmdk ul { list-style:none; margin:0; padding:6px; max-height:min(52vh,420px); overflow:auto; }
  .cmdk li.gh { padding:8px 10px 4px; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; cursor:default; }
  .cmdk li.it { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; cursor:pointer; }
  .cmdk li.it svg { flex:none; color:var(--muted); } .cmdk li.it .g { margin-left:auto; color:var(--muted); font-size:11px; }
  .cmdk li.it[aria-selected="true"] { background:var(--accent-soft); } .cmdk li.it[aria-selected="true"] svg { color:var(--accent); }
  .cmdk .none { padding:22px; text-align:center; color:var(--muted); }
  .cmdk .ft { display:flex; gap:14px; flex-wrap:wrap; padding:9px 14px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
  @media (max-width:980px) { .kbtn { width:auto; } .cmdk-overlay { padding-top:8vh; } }
  @media (hover:none) { .kbtn kbd, .cmdk .ft { display:none; } }
  /* --- logo (2026-10-23): the HRSystem mark replaces the square "HR" */
  img.logo { width:auto; height:34px; border-radius:0; background:none; box-shadow:none; display:block; flex:none; object-fit:contain; }
  .boot-logo { width:auto; height:60px; border-radius:0; background:none; box-shadow:none; display:block; object-fit:contain; }
  /* Kryesore: mini rows inside a card, and the quick-action tiles */
  .mini { display:grid; margin-top:10px; }
  .mini > div { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 0; border-top:1px solid var(--line); font-size:12px; min-width:0; }
  .mini > div:first-child { border-top:0; }
  .mini span { color:var(--muted); flex:none; } .mini b { font-weight:500; overflow-wrap:anywhere; text-align:right; display:inline-flex; align-items:center; gap:7px; min-width:0; }
  .mini .sd { width:7px; height:7px; border-radius:50%; background:var(--st-off); flex:none; } .mini .sd.on { background:var(--st-ok); } .mini .sd.off { background:var(--st-bad); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; }
  .tile { display:flex; align-items:center; gap:11px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--soft); color:var(--text); font:inherit; text-align:left; cursor:pointer; min-width:0; transition:border-color .15s, background-color .15s, transform .14s cubic-bezier(.23,1,.32,1); }
  @media (hover:hover) and (pointer:fine) { .tile:not(:disabled):hover { border-color:var(--accent); background:var(--card); } }
  .tile:not(:disabled):active { transform:scale(.98); } .tile:disabled { opacity:.5; cursor:default; }
  .tile .tt { display:grid; min-width:0; } .tile .tt b { font-weight:600; font-size:12.5px; } .tile .tt span { color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* the search in the page header */
  .top .tr { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end; }
  .hsearch { display:flex; align-items:center; gap:9px; min-width:230px; height:32px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--muted); font:inherit; font-size:12.5px; cursor:pointer; transition:border-color .15s, color .15s, background-color .15s; }
  .hsearch span { flex:1; text-align:left; } .hsearch svg { flex:none; width:15px; height:15px; }
  @media (hover:hover) and (pointer:fine) { .hsearch:hover { border-color:var(--accent); color:var(--text); } }
  @media (max-width:700px) { .hsearch { min-width:0; } .hsearch span, .hsearch kbd { display:none; } .hsearch { width:34px; justify-content:center; padding:0; } .top .tr { justify-content:flex-start; } }
  .mini b { flex-wrap:wrap; justify-content:flex-end; } .mini .iconbtn { margin-left:2px; }
  .mini.recent > div { align-items:flex-start; justify-content:flex-start; gap:14px; } .mini.recent span { min-width:118px; font-size:11.5px; } .mini.recent b { justify-content:flex-start; text-align:left; font-weight:500; }
  .mini a.dom { font-weight:500; }

  /* =====================================================================================================
     v1.5 DESIGN SYSTEM (2026-10-24). This block is the single source of truth for the look: it comes last, so it
     wins over the older polish layers above. Tokens first, then type, controls, shell, components, responsive.
     Inter for everything; the monospace face only for technical values (paths, addresses, ports, logs, keys).
     ===================================================================================================== */
  :root {
    --bg:#F3F5F9; --card:#FFFFFF; --text:#0F172A; --muted:#5B6679; --line:#E3E8F0; --soft:#F6F8FB;
    --accent:#5546F0; --accent-soft:#EEEDFE; --accent-text:#FFFFFF; --accent-hover:#4638DB;
    --side:#0B1220; --side-2:#151E33; --side-text:#C5CDDB; --side-muted:#7C889E;
    --shadow:0 1px 2px rgba(11,18,32,.05);
    --font:"Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono:"JetBrains Mono", "Cascadia Mono", "SF Mono", ui-monospace, Consolas, "Courier New", monospace;
    --r-sm:8px; --r-md:10px; --r-lg:12px;
    --h-ctl:36px; --h-sm:30px;
    --ring:0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
  }
  :root[data-theme='dark'] {
    --bg:#0A0F1C; --card:#111A2E; --text:#E6EAF4; --muted:#94A1B9; --line:#212C45; --soft:#16203A;
    --accent:#7467F5; --accent-soft:#1E2150; --accent-text:#FFFFFF; --accent-hover:#8277F8;
    --side:#060B16; --side-2:#111A2E; --side-text:#C5CDDB; --side-muted:#7C889E;
    --shadow:none;
  }
  html.a11y-contrast { --accent-hover:var(--accent); }

  /* type: Inter, one scale. 22 title / 14 card title / 14 body / 12.5 label and helper / 11.5 metadata */
  body { font:14px/1.5 var(--font); font-feature-settings:"cv11","ss03"; letter-spacing:0; font-variant-numeric:tabular-nums; }
  button, input, select, textarea { font-family:var(--font); }
  code, .mono, .val, pre.log, kbd, .sub.mono { font-family:var(--mono); font-feature-settings:normal; letter-spacing:0; }
  code, .mono, .val { font-size:12.5px; }
  html.a11y-font body, html.a11y-font button, html.a11y-font input, html.a11y-font select, html.a11y-font textarea { font-family:"Segoe UI", Arial, Verdana, sans-serif !important; }
  .top { padding-bottom:18px; margin-bottom:22px; }
  .top h1 { font-size:22px !important; line-height:1.25; font-weight:600; letter-spacing:-.02em; }
  .top p { font-size:13.5px; color:var(--muted); margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow); }
  .card:hover { border-color:var(--line) !important; }
  .card h2 { font-size:14px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--text); margin:0 0 14px; }
  .card h2 small { font-size:12.5px; color:var(--muted); }
  .kh h2, .kpi h2 { font-size:12.5px; font-weight:500; color:var(--muted); }
  .kpi .v { font-size:22px !important; font-weight:600; letter-spacing:-.02em; }
  .kpi .s, .sub, .desc, .hint, .act .item span, ul.list .p span { font-size:12.5px; color:var(--muted); }
  .empty { color:var(--muted); font-size:13.5px; }
  table.kv td, table.kv td.k { font-size:13.5px !important; }
  table.kv td.k { color:var(--muted); }
  table.kv th { font-size:12px; font-weight:500; color:var(--muted); padding:0 6px 8px; text-align:left; }
  .main { padding:28px 32px 20px; }
  .page { max-width:1360px; }

  /* buttons: one height, one radius, five states */
  button.btn, a.btn {
    display:inline-flex; align-items:center; justify-content:center; gap:7px; height:var(--h-ctl); padding:0 16px; border-radius:var(--r-sm);
    font:500 13.5px/1 var(--font); white-space:nowrap; text-decoration:none; cursor:pointer; box-shadow:none;
    color:var(--accent-text); background:var(--accent); border:1px solid var(--accent);
  }
  button.btn:hover, a.btn:hover { background:var(--accent-hover); border-color:var(--accent-hover); filter:none; text-decoration:none; }
  button.btn.ghost, a.btn.ghost { background:var(--card); color:var(--text); border-color:var(--line); }
  button.btn.ghost:hover, a.btn.ghost:hover { background:var(--soft); border-color:color-mix(in srgb, var(--muted) 45%, var(--line)); }
  button.btn.danger, a.btn.danger { background:var(--card); color:var(--bad); border-color:color-mix(in srgb, var(--st-bad) 45%, var(--line)); }
  button.btn.danger:hover { background:var(--badbg); border-color:var(--st-bad); }
  button.btn.danger-solid { background:var(--st-bad); border-color:var(--st-bad); color:#fff; }
  button.btn.danger-solid:hover { background:#d63f3f; border-color:#d63f3f; }
  button.btn.sm, a.btn.sm { height:var(--h-sm); padding:0 12px; font-size:12.5px; border-radius:var(--r-sm); }
  button.btn:disabled, a.btn[aria-disabled="true"] { opacity:1; background:var(--soft); color:color-mix(in srgb, var(--muted) 75%, transparent); border-color:var(--line); cursor:not-allowed; box-shadow:none; }
  button.btn.is-busy, button.btn.is-busy:disabled { opacity:.85; cursor:progress; }
  .iconbtn { display:inline-flex; align-items:center; justify-content:center; height:var(--h-sm); min-width:var(--h-sm); padding:0 10px; border-radius:var(--r-sm); font:500 12.5px/1 var(--font); color:var(--muted); background:var(--card); border:1px solid var(--line); margin-left:0; cursor:pointer; }
  .iconbtn:hover { color:var(--text); background:var(--soft); }
  .iconbtn:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible, a:focus-visible, summary:focus-visible, .tile:focus-visible { outline:2px solid var(--accent); outline-offset:2px; box-shadow:var(--ring); }
  html.a11y-focus :focus-visible { outline:3px solid #f59e0b !important; outline-offset:3px !important; }
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=hidden]), select, textarea { height:var(--h-ctl); border-radius:var(--r-sm); font-size:13.5px; }
  textarea { height:auto; }
  input[type=search], input[type=time] { min-width:0; }

  /* rows of settings and actions: flat rows with a hairline, not a box inside a box */
  .act { gap:0; }
  .act .item { background:transparent; border:0; border-top:1px solid var(--line); border-radius:0; padding:14px 0; gap:16px; }
  .act .item:first-child { border-top:0; padding-top:2px; }
  .act .item:last-child { padding-bottom:2px; }
  .act .item:hover { border-color:var(--line); }
  .act .item b { font-size:13.5px; font-weight:600; }
  .act .item > .row { flex:none; justify-content:flex-end; }
  ul.list li { padding:13px 4px; }
  ul.list .p b { font-size:13.5px; }
  ul.list .p span { font-family:var(--mono); font-size:12px; }
  .pill { height:22px; padding:0 9px; font-size:12px; font-weight:500; }

  /* sidebar: navy, calm, one active style; the bottom section never moves */
  .side { background:var(--side); border-right:1px solid rgba(255,255,255,.05); padding:18px 12px 14px; gap:2px; width:auto; }
  .side .head { margin-bottom:10px; padding-bottom:14px; border-bottom:1px solid var(--side-2); display:grid; gap:10px; }
  .side .brandrow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .side .brandrow .brand { padding:2px 4px; margin:0; border:0; min-width:0; }
  .brand b { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .brand > div { min-width:0; }
  .sidetoggle { flex:none; width:30px; height:30px; display:grid; place-items:center; border-radius:var(--r-sm); border:1px solid var(--side-2); background:transparent; color:var(--side-muted); cursor:pointer; padding:0; }
  .sidetoggle:hover { background:var(--side-2); color:#fff; }
  .side .gearbtn.wide { height:38px; padding:0 12px; border-radius:var(--r-sm); border:1px solid var(--side-2); color:var(--side-text); font-size:13.5px; }
  .side .gearbtn.wide:hover { background:var(--side-2); color:#fff; }
  .side .gearbtn.on { background:color-mix(in srgb, var(--accent) 24%, transparent); color:#fff; border-color:transparent; }
  .nav { gap:2px; margin-top:2px; }
  .nav button { height:40px; padding:0 12px; gap:12px; border-radius:var(--r-sm); font-size:13.5px; font-weight:500; color:var(--side-text); background:transparent; position:relative; }
  .nav button svg { width:18px; height:18px; opacity:.85; }
  .nav button:hover { background:rgba(255,255,255,.06); color:#fff; }
  .nav button.on { background:color-mix(in srgb, var(--accent) 26%, transparent); color:#fff; font-weight:600; }
  .nav button.on svg { color:#B7B0FF; opacity:1; }
  .nav button.on::before { content:""; position:absolute; left:-12px; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:#8F86FF; }
  .nav .count { font-size:11px; font-weight:600; min-width:20px; text-align:center; padding:1px 7px; }
  .side .credit-side { margin-top:auto; padding:8px 10px 10px; font-size:11.5px; letter-spacing:0; }
  .side .foot { border-top:1px solid var(--side-2); padding:12px 4px 0; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:0; }
  .side .foot button { display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 10px; border-radius:var(--r-sm); font-size:12.5px; color:var(--side-text); border:1px solid var(--side-2); background:transparent; }
  .side .foot button:hover { background:var(--side-2); color:#fff; }
  .side .foot button svg { width:15px; height:15px; }
  .live { font-size:11.5px; font-weight:600; letter-spacing:.06em; }
  .live b { font-weight:600 !important; }

  /* collapsed sidebar (desktop and tablet): icons only, labels in tooltips */
  @media (min-width:981px) {
    .app { transition:grid-template-columns .2s var(--ease-out); }
    .app.collapsed { grid-template-columns:72px minmax(0,1fr); }
    .app.collapsed .side { padding:18px 10px 14px; align-items:stretch; }
    .app.collapsed .lbl, .app.collapsed .brand > div, .app.collapsed .credit-side, .app.collapsed .live b, .app.collapsed .nav .count { display:none; }
    .app.collapsed .side .brandrow { flex-direction:column; justify-content:center; gap:10px; }
    .app.collapsed .side .brandrow .brand { justify-content:center; padding:0; }
    .app.collapsed img.logo { max-width:34px; object-fit:cover; object-position:left center; }
    .app.collapsed .nav button, .app.collapsed .gearbtn.wide { justify-content:center; padding:0; gap:0; }
    .app.collapsed .nav button.on::before { left:-10px; }
    .app.collapsed .side .foot { flex-direction:column; padding-top:12px; }
    .app.collapsed .side .foot button { padding:0; width:34px; justify-content:center; gap:0; }
    .sidetoggle svg { transition:transform .2s var(--ease-out); } .app.collapsed .sidetoggle svg { transform:rotate(180deg); }
  }
  @media (max-width:980px) { .sidetoggle { display:none; } .side .brandrow { display:contents; } .side .head { display:flex; } }

  /* version history: the newest release open, the others collapsed; native <details> so mouse, keyboard and touch all work */
  .vlist { display:grid; gap:8px; }
  details.vh { border:1px solid var(--line); border-radius:var(--r-md); background:var(--card); }
  details.vh.latest { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); background:color-mix(in srgb, var(--accent-soft) 55%, var(--card)); }
  details.vh > summary { list-style:none; display:flex; align-items:center; gap:12px; min-height:46px; padding:8px 14px; cursor:pointer; border-radius:var(--r-md); user-select:none; }
  details.vh > summary::-webkit-details-marker { display:none; }
  details.vh > summary:hover { background:var(--soft); }
  details.vh.latest > summary:hover { background:transparent; }
  .vnum { font-weight:600; font-size:14px; flex:none; }
  .vdate { color:var(--muted); font-size:12.5px; flex:none; }
  .vsum { color:var(--muted); font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vchev { flex:none; width:18px; height:18px; color:var(--muted); transition:transform .18s var(--ease-out); }
  details.vh[open] > summary .vchev { transform:rotate(180deg); }
  .vbody { padding:2px 16px 14px 14px; border-top:1px solid var(--line); }
  .vbody .notes { border:0; padding:0; }
  .vbody .notes ul { margin:8px 0 0 18px; }
  @media (max-width:700px) { details.vh > summary { flex-wrap:wrap; row-gap:2px; } .vsum { flex-basis:100%; order:5; white-space:normal; } .vchev { margin-left:auto; } }

  /* folder management */
  .fold { display:grid; gap:14px; }
  .fold-head { display:flex; align-items:flex-start; gap:12px; }
  .fold-head .kic { margin-top:1px; }
  .fold-title { display:grid; gap:2px; min-width:0; flex:1; } .fold-title b { font-size:14px; font-weight:600; } .fold-title span { color:var(--muted); font-size:12.5px; }
  .fold-path { display:block; width:100%; padding:10px 12px; border-radius:var(--r-sm); background:var(--soft); border:1px solid var(--line); font:12.5px/1.45 var(--mono); overflow-wrap:anywhere; }
  .fold-path.none { font-family:var(--font); color:var(--muted); border-style:dashed; }
  .fold-state { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:var(--r-sm); font-size:13px; line-height:1.45; background:var(--soft); }
  .fold-state.ok { background:var(--okbg); } .fold-state.bad { background:var(--badbg); } .fold-state.warn { background:var(--warnbg); }
  .fold-state b { font-weight:600; }
  .fold-actions { display:flex; flex-wrap:wrap; gap:8px; }
  .fold-note { color:var(--muted); font-size:12px; }

  /* logs: one line = one event, coloured by level with a marker so colour is never the only cue */
  pre.log { font-size:12.5px; line-height:1.6; padding:8px 0; border-radius:var(--r-md); }
  pre.log .ln { display:block; padding:1px 14px 1px 11px; border-left:3px solid transparent; white-space:pre-wrap; word-break:break-word; }
  pre.log .ln.warn { background:var(--warnbg); border-left-color:var(--st-warn); color:var(--warn); }
  pre.log .ln.err { background:var(--badbg); border-left-color:var(--st-bad); color:var(--bad); }
  .errline { color:var(--bad); }
  .lvl { display:inline-block; min-width:42px; font-weight:600; font-size:11px; letter-spacing:.04em; margin-right:8px; opacity:.9; }
  .row.tabs { gap:6px; margin-bottom:4px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:14px 0; }
  .toolbar input[type=search] { width:min(320px,100%); }
  .group-h { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding:14px 6px 4px; }
  .danger-zone { border-color:color-mix(in srgb, var(--st-bad) 35%, var(--line)); }
  .danger-zone h2 { color:var(--bad); }
  .dlg { border-radius:14px; }
  .banner { border-radius:var(--r-lg); }
  .tile { border-radius:var(--r-md); }
  @media (max-width:980px) {
    .main { padding:18px 16px; }
    .nav button { height:38px; }
    .nav button.on::before { display:none; }
    .nav button .lbl { display:inline; }
    .side .foot { padding:0; border:0; }
    .side .foot button { display:inline-flex; }
    .act .item { flex-wrap:wrap; }
    .act .item > .row { flex:1 1 100%; justify-content:flex-start; }
  }
  @media (max-width:980px) { .side .foot button .lbl { display:none; } .side .foot button { width:34px; padding:0; justify-content:center; gap:0; } }
  @media (max-width:700px) { ul.list li { flex-wrap:wrap; } ul.list li > .row { width:100%; } }
  @media (max-width:520px) { .top h1 { font-size:20px !important; } .card { padding:16px; } .toolbar input[type=search] { width:100%; } }
</style>
</head>

(() => {
  const plainFetch = window.fetch.bind(window);
  window.fetch = async (...args) => {
    const res = await plainFetch(...args);

  ["Një orar për backup-in dhe përditësimin. Databaza ruhet vetëm një herë.", "One schedule for the backup and the update. The database is saved only once.", "Jedan raspored za backup i ažuriranje. Baza se čuva samo jednom."],
  ["Çfarë niset kur ndizet kompjuteri.", "What starts when the computer turns on.", "Šta se pokreće kada se računar uključi."],
  ["Ekzekuton një skedar .sql, me backup para.", "Runs a .sql file, with a backup first.", "Izvršava .sql fajl, uz prethodni backup."], ["Zëvendëson databazën me një dump, me backup para.", "Replaces the database with a dump, with a backup first.", "Zamenjuje bazu dump-om, uz prethodni backup."],
  ["I vendosur.", "Set.", "Postavljen."], ["Mungon: pa të nuk merren përditësime.", "Missing: without it no updates are received.", "Nedostaje: bez njega se ne primaju ažuriranja."],
  ["Disk i jashtëm, folder rrjeti ose cloud. Nëse prishet PC-ja, backup-et mbeten.", "External disk, network folder or cloud. If the PC breaks, the backups remain.", "Spoljni disk, mrežna ili cloud fascikla. Ako se računar pokvari, backup-i ostaju."],
  ["Kopjon backup-et që mungojnë.", "Copies the backups that are missing.", "Kopira backup-e koji nedostaju."], ["Bëj backup për \"", "Back up \"", "Backup za \""],
  ["Ndaloj nisjen automatike të të gjitha? Pas rinisjes asgjë nuk niset vetë.", "Stop automatic start of everything? After a restart nothing starts by itself.", "Zaustavi automatsko pokretanje svega? Posle restarta se ništa ne pokreće samo."],
  ["Backup, build dhe migrime; nëse dështon, kthehet vetë.", "Backup, build and migrations; if it fails, it rolls back by itself.", "Backup, build i migracije; ako ne uspe, vraća se samo."],
  ["Kontakto Administratorin", "Contact the Administrator", "Kontaktiraj administratora"], ["Për ndihmë ose probleme.", "For help or problems.", "Za pomoć ili probleme."],
  ["Zona e rrezikut", "Danger zone", "Opasna zona"], ["Çinstalo HRSystem", "Uninstall HRSystem", "Deinstaliraj HRSystem"], ["Heq HRSystem nga ky kompjuter. Pyet dy herë; aty zgjedh a ruhet databaza.", "Removes HRSystem from this computer. It asks twice; there you choose whether the database is kept.", "Uklanja HRSystem sa ovog računara. Pita dvaput; tamo biraš da li se baza čuva."], ["A je i sigurt? Çinstalimi heq HRSystem nga ky kompjuter dhe nuk kthehet.", "Are you sure? Uninstalling removes HRSystem from this computer and cannot be undone.", "Da li si siguran? Deinstalacija uklanja HRSystem sa ovog računara i ne može da se poništi."],

  /* v1.5: design system, collapsible menu, version accordion, folder management, log levels */
  ["Zgjero menunë", "Expand the menu", "Proširi meni"], ["Mbyll menunë", "Collapse the menu", "Skupi meni"], ["E fundit", "Latest", "Najnovija"],
  ["Pa folder", "No folder", "Bez fascikle"], ["I shkëputur", "Disconnected", "Isključeno"], ["Në pritje", "Waiting", "Na čekanju"], ["I lidhur", "Connected", "Povezano"], ["Nuk arrihet", "Not reachable", "Nedostupno"],
  ["Aksesohet", "Accessible", "Dostupno"], ["Nuk ekziston", "Does not exist", "Ne postoji"], ["Menaxho", "Manage", "Upravljaj"],
  ["Asnjë folder i zgjedhur.", "No folder selected.", "Nijedna fascikla nije izabrana."],
  ["Disk i jashtëm, disk rrjeti, folder rrjeti ose folder cloud.", "External drive, network drive, network folder or cloud folder.", "Spoljni disk, mrežni disk, mrežna fascikla ili cloud fascikla."],
  ["Rruga e plotë", "Full path", "Puna putanja"], ["Kopjo rrugën", "Copy the path", "Kopiraj putanju"], ["Ndrysho folderin", "Change folder", "Promeni fasciklu"], ["Zgjidh folderin", "Select folder", "Izaberi fasciklu"],
  ["Shkëput", "Disconnect", "Isključi"], ["Rilidh", "Reconnect", "Ponovo poveži"], ["Hiq folderin", "Remove folder", "Ukloni fasciklu"],
  ["Shkruaj rrugën e plotë të folderit ku kopjohen backup-et (disk i jashtëm, disk rrjeti ose folder cloud), p.sh. E:\\HRBackup ose \\\\server\\share:", "Type the full path of the folder where backups are copied (external drive, network drive or cloud folder), e.g. E:\\HRBackup or \\\\server\\share:", "Unesi punu putanju fascikle u koju se kopiraju backup-ovi (spoljni disk, mrežni disk ili cloud fascikla), npr. E:\\HRBackup ili \\\\server\\share:"],
  ["Heq folderin e kopjes jashtë PC-së?", "Remove the off-PC copy folder?", "Ukloniti fasciklu za kopiju van računara?"],
  ["Backup-et që u kopjuan aty mbeten; nuk fshihen. Më pas backup-et ruhen vetëm në këtë PC.", "The backups copied there stay; they are not deleted. After that, backups are kept only on this PC.", "Backup-ovi kopirani tamo ostaju; ne brišu se. Posle toga se backup-ovi čuvaju samo na ovom računaru."],
  ["Windows nuk lejon shkrim në këtë folder. Zgjidh një folder ku ky përdorues mund të shkruajë, ose jepi lejen te Properties > Security.", "Windows does not allow writing to this folder. Choose a folder this user can write to, or grant permission in Properties > Security.", "Windows ne dozvoljava upis u ovu fasciklu. Izaberi fasciklu u koju ovaj korisnik može da piše ili dodeli dozvolu u Properties > Security."],
  ["Rruga tregon një skedar, jo një folder. Zgjidh një folder.", "The path points to a file, not a folder. Choose a folder.", "Putanja pokazuje na datoteku, a ne na fasciklu. Izaberi fasciklu."],
  ["Nuk ka hapësirë të lirë. Liro vend ose zgjidh një folder tjetër.", "There is no free space. Free some space or choose another folder.", "Nema slobodnog prostora. Oslobodi prostor ili izaberi drugu fasciklu."],
  ["Folderi nuk arrihet. Kontrollo që disku i jashtëm është i lidhur ose kompjuteri i rrjetit është i ndezur, pastaj shtyp \"Kopjo\".", "The folder cannot be reached. Check that the external drive is connected or the network computer is on, then press \"Copy\".", "Fascikla nije dostupna. Proveri da li je spoljni disk povezan ili je mrežni računar uključen, pa pritisni \"Kopiraj\"."],
  ["Kontrollo rrugën e folderit dhe provo përsëri.", "Check the folder path and try again.", "Proveri putanju fascikle i pokušaj ponovo."],
  ["Backup-et mbeten vetëm në këtë PC. Nëse prishet kompjuteri, humbasin.", "Backups stay only on this PC. If the computer fails, they are lost.", "Backup-ovi ostaju samo na ovom računaru. Ako se računar pokvari, gube se."],
  ["Kopjimi automatik është i fikur. Folderi ruhet; shtyp \"Rilidh\" për ta ndezur.", "Automatic copying is off. The folder is kept; press \"Reconnect\" to turn it on.", "Automatsko kopiranje je isključeno. Fascikla se čuva; pritisni \"Ponovo poveži\" da ga uključiš."],
  ["Ende pa kopje. Shtyp \"Kopjo\" për të provuar lidhjen.", "No copy yet. Press \"Copy\" to test the connection.", "Još nema kopije. Pritisni \"Kopiraj\" da proveriš vezu."],
  ["Kopja e fundit: ", "Last copy: ", "Poslednja kopija: "], [" të reja)", " new)", " novih)"], [" (gjithçka ishte e kopjuar)", " (everything was already copied)", " (sve je već kopirano)"],
  ["Dashboard-i nuk shfleton disqet: ti ngjit rrugën e plotë dhe ai e provon duke shkruar një skedar të vogël aty.", "The dashboard does not browse disks: you paste the full path and it tests it by writing a small file there.", "Dashboard ne pretražuje diskove: ti nalepiš punu putanju, a on je proverava upisom male datoteke."],
  ["Folderi u kontrollua dhe u ruajt.", "The folder was checked and saved.", "Fascikla je proverena i sačuvana."], ["Kopjimi automatik u fik. Folderi ruhet.", "Automatic copying is off. The folder is kept.", "Automatsko kopiranje je isključeno. Fascikla se čuva."],
  ["Kopjimi automatik u ndez.", "Automatic copying is on.", "Automatsko kopiranje je uključeno."], ["Folderi u hoq.", "The folder was removed.", "Fascikla je uklonjena."],
  ["Folderët e instalimit", "Installation folders", "Fascikle instalacije"], ["Rrugët e instalimit dhe folderi i kopjeve", "Installation paths and the copy folder", "Putanje instalacije i fascikla za kopije"],
  ["Nuk ka folderë për t'u shfaqur.", "No folders to show.", "Nema fascikli za prikaz."],
  ["Pa folder: backup-et mbeten vetëm në këtë PC.", "No folder: backups stay only on this PC.", "Bez fascikle: backup-ovi ostaju samo na ovom računaru."],
  ["Rikthim dhe zona e rrezikut", "Recovery and danger zone", "Povraćaj i opasna zona"], ["Veprime që ndryshojnë ose zëvendësojnë të dhëna. Para secilit bëhet backup dhe të pyet përsëri.", "Actions that change or replace data. A backup is made first and you are asked again.", "Radnje koje menjaju ili zamenjuju podatke. Prvo se pravi backup, a zatim te sistem pita ponovo."],
  ["GABIM", "ERROR", "GREŠKA"], ["KUJDES", "WARNING", "UPOZORENJE"],
  /* dashboard release notes (DASH_NOTES), whole lines so a line is never half translated */
  ["Dashboard-i lexon përditësimet nga emri i ri i GitHub (rogest-network); emri i vjetër vazhdon të punojë.","The dashboard reads updates from the new GitHub name (rogest-network); the old name keeps working.","Dashboard čita ažuriranja sa novog GitHub imena (rogest-network); staro ime i dalje radi."],
  ["Faqe e re në menu: \"Çfarë ka të re\" (dashboard-i dhe programi).","A new page in the menu: \"What is new\" (the dashboard and the program).","Nova stranica u meniju: \"Šta je novo\" (dashboard i program)."],
  ["Versioni i parë me numër: pasqyra, backup-et, përditësimet, njoftimet.","The first numbered version: overview, backups, updates, notifications.","Prva numerisana verzija: pregled, backup-ovi, ažuriranja, obaveštenja."],
  ["Pamje e re profesionale: font Inter, menu e errët, ngjyra vjollcë, karta dhe butona të njëjtë në çdo faqe.","A new professional look: the Inter font, a dark menu, purple accents, and the same cards and buttons on every page.","Novi profesionalni izgled: font Inter, tamni meni, ljubičasti akcenti i iste kartice i dugmad na svakoj stranici."],
  ["Menuja anësore mbyllet me shigjetën lart (vetëm ikona); mbahet mend zgjedhja.","The side menu collapses with the arrow at the top (icons only); your choice is remembered.","Bočni meni se skuplja strelicom na vrhu (samo ikone); izbor se pamti."],
  ["Çfarë ka të re: vetëm versioni i fundit është i hapur, të vjetrit hapen me një klik.","What is new: only the latest version is open; older ones open with a click.","Šta je novo: otvorena je samo najnovija verzija, starije se otvaraju klikom."],
  ["Kopje jashtë PC-së: karta e re e folderit me rrugën e plotë, gjendjen dhe veprimet Ndrysho, Shkëput, Rilidh, Hiq.","Copy outside this PC: a new folder card with the full path, the status and the actions Change, Disconnect, Reconnect, Remove.","Kopija van računara: nova kartica fascikle sa punom putanjom, stanjem i radnjama Promeni, Isključi, Ponovo poveži, Ukloni."],
  ["Veprime: veprimet e përditshme janë ndarë nga rikthimi dhe zona e rrezikut.","Actions: everyday actions are now separate from recovery and the danger zone.","Radnje: svakodnevne radnje su odvojene od povraćaja i opasne zone."],
  ["Log-u dhe Gabimet: rreshtat e gabimeve dhe kujdesit kanë ngjyrë dhe fjalë (GABIM, KUJDES).","Log and Errors: error and warning lines have a colour and a word (ERROR, WARNING).","Log i Greške: redovi grešaka i upozorenja imaju boju i reč (GREŠKA, UPOZORENJE)."],
  ["Cilësimet janë tani një buton i gjerë lart, poshtë logos.","Settings is now a wide button at the top, under the logo.","Podešavanja su sada široko dugme na vrhu, ispod logotipa."],
  ["Çinstalo HRSystem u zhvendos te fundi i faqes Veprime (Zona e rrezikut) dhe pyet dy herë.","Uninstall HRSystem moved to the bottom of the Actions page (Danger zone) and asks twice.","Deinstalacija HRSystem premeštena je na dno stranice Radnje (Opasna zona) i pita dvaput."],
  ["Përditësimi tregon tani si u krye: automatikisht (nata) ose manualisht (me buton), te Historiku, Veprimet e fundit, Log-u dhe njoftimi në telefon.","An update now shows how it ran: automatically (night) or manually (button), in History, Latest actions, Log and the phone message.","Ažuriranje sada pokazuje kako je izvršeno: automatski (noću) ili ručno (dugme), u Istoriji, Poslednjim radnjama, Logu i poruci na telefonu."],
  ["Njoftimet: zgjedh çfarë të vijë në telefon (aplikacioni, adresat, backup-et, disku, përditësimet, raporti i ditës); teksti u shkurtua.","Notifications: choose what reaches the phone (application, addresses, backups, disk, updates, daily report); the text was shortened.","Obaveštenja: biraš šta stiže na telefon (aplikacija, adrese, backup-ovi, disk, ažuriranja, dnevni izveštaj); tekst je skraćen."],
  ["Eksporto SQL: shkarkon një dump të databazës me një klikim (te Veprime › Databaza).","Export SQL: downloads a database dump in one click (Actions › Database).","Izvoz SQL: preuzima dump baze jednim klikom (Radnje › Baza)."],
  ["Cilësimet: kartë e re \"Kontakto Administratorin\" me WhatsApp dhe email.","Settings: a new \"Contact the Administrator\" card with WhatsApp and email.","Podešavanja: nova kartica \"Kontaktiraj administratora\" sa WhatsApp-om i emailom."],
  ["Butonat pa \"tani\" (Backup, Kopjo, Ndrysho, Dërgo raportin) dhe tekste më të shkurtra te Veprime.","Buttons without \"now\" (Backup, Copy, Change, Send the report) and shorter texts in Actions.","Dugmad bez \"sada\" (Backup, Kopiraj, Promeni, Pošalji izveštaj) i kraći tekstovi u Radnjama."],
  ["Kryesore: tekstet \"e fundit\", \"në 24 orë\" dhe \"dashboard-i dhe programi\" tani përkthehen edhe në anglisht e serbisht.","Home: the texts \"last\", \"in 24 hours\" and \"the dashboard and the program\" are now translated into English and Serbian too.","Početna: tekstovi \"poslednji\", \"u 24 sata\" i \"dashboard i program\" sada su prevedeni i na engleski i srpski."],
  ["Kryesore: \"Veprime të shpejta\" janë tani më lart, para kartave.","Home: \"Quick actions\" now sit higher, before the cards.","Početna: \"Brze radnje\" su sada više, ispred kartica."],
  ["Kryesore: adresat nuk dyfishohen më. Karta \"Lidhja\" ka adresat dhe veprimet (hiq domenin, ndrysho adresën ose tunelin), ndërsa poshtë shfaqen \"Veprimet e fundit\".","Home: addresses are no longer shown twice. The \"Connection\" card holds the addresses and actions (remove a domain, change the address or the tunnel), and \"Latest actions\" appears below.","Početna: adrese se više ne prikazuju dvaput. Kartica \"Veza\" ima adrese i radnje (ukloni domen, promeni adresu ili tunel), a ispod su \"Poslednje radnje\"."],
  ["Logoja e re e HRSystem në vend të katrorit \"HR\": te menuja, ekrani i ngarkimit, faqja e hyrjes dhe ikona e faqes.","The new HRSystem logo replaces the \"HR\" square: in the menu, the loading screen, the sign-in page and the page icon.","Novi HRSystem logotip zamenjuje kvadrat \"HR\": u meniju, na ekranu učitavanja, na stranici prijave i kao ikona stranice."],
  ["Kryesore ka opsione të reja: veprime të shpejta (backup, përditëso, log-u, historiku, gabimet, kopjo adresën, çfarë ka të re).","Home has new options: quick actions (backup, update, log, history, errors, copy the address, what is new).","Početna ima nove opcije: brze radnje (backup, ažuriranje, log, istorija, greške, kopiraj adresu, šta je novo)."],
  ["Kartat Databaza dhe Lidhja janë më të plota: emri, serveri, madhësia, backup i fundit; adresat, domeni dhe tuneli me gjendje.","The Database and Connection cards are fuller: name, server, size, last backup; addresses, domain and tunnel with status.","Kartice Baza i Veza su potpunije: ime, server, veličina, poslednji backup; adrese, domen i tunel sa stanjem."],
  ["Dizajn i ri: shkronja JetBrains Mono, kartat kanë ikona (CPU, databazë, lidhje, disk, version, backup) dhe faqja \"Pasqyra\" quhet \"Kryesore\".","New design: the JetBrains Mono font, cards with icons (CPU, database, connection, disk, version, backup), and the \"Overview\" page is now called \"Home\".","Novi dizajn: font JetBrains Mono, kartice sa ikonama (CPU, baza, veza, disk, verzija, backup), a stranica \"Pregled\" se sada zove \"Početna\"."],
  ["Kërkim me Ctrl + K: faqet, instalimet dhe veprimet e shpejta (hap aplikacionin, backup, përditëso, tema).","Search with Ctrl + K: pages, installations and quick actions (open the app, backup, update, theme).","Pretraga sa Ctrl + K: stranice, instalacije i brze radnje (otvori aplikaciju, backup, ažuriranje, tema)."],
  ["Ngjyra të njëjta për statuset kudo: online / sukses, offline / gabim, paralajmërim, duke u lidhur, joaktiv, në pritje, mirëmbajtje.","The same colours for statuses everywhere: online / success, offline / error, warning, connecting, inactive, waiting, maintenance.","Iste boje za statuse svuda: online / uspeh, offline / greška, upozorenje, povezivanje, neaktivno, na čekanju, održavanje."],
  ["Dashboard-i ka numër versioni dhe pas çdo përditësimi të vetes tregon çfarë ka të re, në faqe dhe në njoftimin në telefon.","The dashboard has a version number and, after each self-update, shows what is new, on the page and in the phone message.","Dashboard ima broj verzije i posle svakog samostalnog ažuriranja prikazuje šta je novo, na stranici i u poruci na telefonu."],
  ["Shënimet e versionit të programit (çfarë ka të re) shfaqen te Pasqyra para përditësimit dhe në njoftimin \"Ka version të ri\".","The program release notes (what is new) appear on Overview before the update and in the \"New version available\" message.","Beleške o verziji programa (šta je novo) prikazuju se na Pregledu pre ažuriranja i u poruci \"Ima nova verzija\"."],
  ["Njoftimi \"Përditësimi u krye\" i përsërit çfarë ka të re.","The \"Update finished\" message repeats what is new.","Poruka \"Ažuriranje je završeno\" ponavlja šta je novo."],
  ["Puna automatike e natës rinis kur ndërron orën (p.sh. nga 01:00 në 19:00), edhe nëse sot ka punuar tashmë; historiku tregon pse nuk u nis.","The automatic night job restarts when the hour is changed (e.g. from 01:00 to 19:00), even if it already ran today; the history says why it did not start.","Automatski noćni posao se ponovo pokreće kad se promeni sat (npr. sa 01:00 na 19:00), čak i ako je danas već radio; istorija kaže zašto nije pokrenut."],
  /* v1.6: the programs of the system (Node.js, cloudflared) */
  ["Veprime: karta e re \"Programet e sistemit\" tregon versionin e Node.js dhe të cloudflared (tunelit) dhe të rejat nga interneti.","Actions: the new card \"Programs of the system\" shows the version of Node.js and of cloudflared (the tunnel) and the newest ones from the internet.","Akcije: nova kartica \"Programi sistema\" prikazuje verziju Node.js i cloudflared (tunela) i najnovije sa interneta."],
  ["Mund t'i përditësosh me një buton (pyet dy herë; hapat shihen te Log-u). Node.js ndryshon vetëm brenda të njëjtit version të madh dhe kontrollohet me SHA-256; cloudflared përditësohet me winget.","You can update them with a button (it asks twice; the steps are in Log). Node.js changes only inside the same major version and is checked with SHA-256; cloudflared is updated with winget.","Možeš ih ažurirati dugmetom (pita dvaput; koraci su u Logu). Node.js se menja samo unutar iste glavne verzije i proverava se SHA-256; cloudflared se ažurira pomoću winget."],
  ["Rreshtat e Log-ut përkthehen sipas gjuhës së zgjedhur.","The lines of Log are translated into the chosen language.","Redovi Loga se prevode na izabrani jezik."],
  ["Programet e sistemit","Programs of the system","Programi sistema"],
  ["Node.js ndez aplikacionin; cloudflared ndez tunelin. Versionet e reja shfaqen këtu; përditësimi bëhet vetëm kur e shtyp.","Node.js runs the application; cloudflared runs the tunnel. New versions appear here; an update is done only when you press it.","Node.js pokreće aplikaciju; cloudflared pokreće tunel. Nove verzije se prikazuju ovde; ažuriranje se radi samo kada ga pritisneš."],
  ["Nuk u lexuan versionet.","The versions could not be read.","Verzije nisu pročitane."],

  ["): nuk ndryshohet vetë.","): it is not changed by itself.","): ne menja se sam."],
  ["Aplikacioni ndalet për pak çaste dhe ndizet përsëri. Node.js i ri hyn plotësisht në fuqi pas rinisjes së kompjuterit.","The application stops for a moment and starts again. The new Node.js takes full effect after the computer restarts.","Aplikacija se zaustavlja na trenutak i ponovo pokreće. Novi Node.js potpuno stupa na snagu posle restartovanja računara."],
  ["Tuneli ndalet për pak çaste: aplikacioni nuk hapet nga interneti derisa të ndizet përsëri.","The tunnel stops for a moment: the application cannot be opened from the internet until it starts again.","Tunel se zaustavlja na trenutak: aplikacija se ne otvara sa interneta dok se ponovo ne pokrene."],
  ["A je i sigurt? Përditësimi niset menjëherë; hapat shihen te Log-u.","Are you sure? The update starts at once; its steps are in Log.","Da li si siguran? Ažuriranje počinje odmah; koraci su u Logu."],

      ['Veprime: njoftime në telefon (ntfy)', ['1) Instalo aplikacionin falas ntfy në telefon. 2) Shtyp + dhe abonohu te një emër teme që e zgjedh ti (i gjatë dhe i fshehtë, p.sh. hrsystem-dyqan-k7x2). 3) Te Veprime shtyp Vendos temën dhe shkruaj saktësisht të njëjtin emër. 4) Shtyp Dërgo provë. Te "Çfarë njoftohet" zgjedh cilat lloje mesazhesh vijnë: aplikacioni, adresat, backup-et, disku, përditësimet dhe raporti i ditës.', 'Njoftimi vjen kur: aplikacioni u ndal, u ndez ose u rindez manualisht; u mbyll vetë (pas 1 minute) ose u ndez vetë; backup-i i fundit është më i vjetër se 2 ditë; një adresë nuk hapet 5 minuta; backup-i ose përditësimi dështon; përditësimi kryhet; kopja jashtë PC-së dështon; ka pak hapësirë në disk. Çdo mesazh ka emrin e kompanisë, rëndësinë (ikonë dhe zë) dhe orën.', 'Raporti i ditës vjen në orën që zgjedh ti (parazgjedhje 08:00; ose sapo hapet dashboard-i pas asaj ore): aplikacioni, databaza, backup-i, disku, adresat dhe versioni, me "gjithçka OK" ose çfarë nuk shkon. Mund ta dërgosh edhe vetë me "Dërgo raportin".', 'Emri i temës është si fjalëkalim: mos e ndaj. Mesazhet nuk kanë të dhëna personale.']],
      ['Veprime: lidhjet', ['Token GitHub (vetëm-lexim) për të marrë përditësime, ruhet i enkriptuar. Cloudflare Tunnel për adresën publike.']],
      ['Backup-et', ['Emri është Emri-Data-Ora.sql. Çdo backup tregon versionin e programit që punonte kur u bë dhe kontrollin OK ose Dëmtuar (skedar i plotë ose jo).', 'Shkarko, Testo, Rikthe, Hap (folderi), Fshi. Testo e ngarkon backup-in në një databazë të përkohshme, kontrollon tabelat dhe përdoruesit dhe e fshin; pa e prekur databazën tënde. Rikthe bën para një backup të gjendjes së tanishme, pastaj zëvendëson databazën me atë backup.', 'Backup-i ruan vetëm databazën. Programi (kodi, formularët) vjen nga GitHub dhe nga versionet në këtë PC.']],
      ['Historiku dhe diagnostika', ['Historiku: 200 veprimet e fundit (backup, përditësime, rikthime, ndalime, probleme, kopje jashtë PC-së).', 'Log-u: rezultati i veprimit të fundit. Shkarko diagnostikën jep një skedar .txt me gjendjen dhe fundin e log-eve (sekretet janë të fshehura), për t\'ia dërguar dikujt kur ka problem.']],
      ['Cilësimet (ingranazhi)', ['Gjuha e gjithë dashboard-it: Shqip, English ose Srpski. Tema: Sistemi, Drita ose Errët. Madhësia e shkrimit, kontrast i lartë, pa animacione, shkrim i lexueshëm, lidhje me nënvizim.', 'Fjalëkalimi i dashboard-it është opsional: vendose nëse kompjuteri përdoret nga disa persona. Harrove? Fshi skedarin manager\\dashboard.key.']],
      ['Dashboard-i përditësohet vetë', ['Çdo 10 minuta kontrollon repo-n e dashboard-it dhe merr ndryshimet; pas përditësimit faqja rifreskohet një herë. Kur dashboard-i rindizet, faqja e hapur rifreskohet vetë (nuk del "forbidden").']],
      ['Probleme të zakonshme', ['Dashboard-i nuk hapet: hap Dashboard.bat (kërkon Administrator).', 'Aplikacioni del Fikur: shtyp Start. Nëse kishte rënë vetë, shih Historikun.', 'Kalendari ose faqja nuk ngarkon në telefon: shih diagnostikën e rrjetit te aplikacioni.', 'Nuk të vijnë njoftimet: kontrollo që emri i temës është i njëjtë në telefon dhe në dashboard, pastaj Dërgo provë.']],

  en: {
    name: 'English', nav: 'How to use', title: 'How to use the dashboard', sub: 'The complete guide: every page and every feature.',
    sections: [
      ['What it is', ['The dashboard manages the HRSystem installation on this computer: it follows the LIVE status, makes backups, updates and rolls back the program, gives you the addresses and data, and notifies your phone.', 'It opens with Dashboard.bat and works only on this PC (127.0.0.1). It is not reachable from the internet.', 'The gear at the top right opens Settings. The LIVE dot in the menu shows that the connection is alive.']],
      ['Overview', ['Application: Online or Off, with the answer time in milliseconds. While it is off it is not measured continuously.', 'Database, Version (a "Update" notice appears when a new version exists) and the public Address.', 'Space used by HR: how much disk the program, the database and the backups use, plus the free disk left.', 'HR system: CPU and RAM of the application and its database only (not of the whole computer), and how long the application has been running.', 'Download / Upload (HR): how much data the HR system reads and writes, with the speed now, today\'s total and the total since it started.', 'Latest backup, with the program version and the OK or Damaged mark.', 'Buttons at the top: Open the app, Open /developer, Stop, Start, Restart. Stop is active only while the application runs, Start only while it is off.']],
      ['Data', ['The addresses, the installation (version, repo, folders, database, ports) and the settings with the secrets (.env, tokens). Secrets are hidden: press Show or Copy.', 'The command to connect to the database from the terminal.']],
      ['Addresses and the tunnel', ['The addresses are one list: the domains that the application learns by itself and the temporary address are all just addresses. Each one shows whether it opens.', 'No address is removed by itself, not even when it does not open. It is removed only when you press Remove.', 'Change: choose a temporary address (no domain, created at once, but it changes each time it is created again) or connect your own domain with a Cloudflare tunnel (token). You can also remove the domain tunnel.', 'The temporary address survives the restart and the update of the dashboard.']],
      ['Actions: update and version rollback', ['Update the application: active only when a new version exists. It makes a backup, installs, runs the SQL migrations of the version and switches; if it fails it goes back to the old version by itself. Follow it with the progress bar.', 'Go back to a version: puts the code (forms, design) back to an older version, from the versions on this PC (no download) or from GitHub. "Restore + database" also restores the database of that version\'s backup.', 'After a rollback the version is pinned: the automatic update and the notice ignore the versions up to the one GitHub had. The update resumes when a newer version appears, or when you press "Remove the pin".', 'Rolling the code back does not change the database; if the old version needs it, use "Restore + database".']],
      ['Actions: backup and Automatic', ['Backup makes a copy of the database (database only).', 'Automatic: one schedule for the backup and the update; choose the hour and how many backups to keep. Two independent switches: Database backup and Update the program.', 'When a new version exists and the update is on, the update runs (it starts with a backup), so the database is saved once, not twice. Otherwise only the backup is made.', 'Only the backups made by this schedule are deleted. The ones you make, the update\'s and the safety backups before a restore are never deleted.', 'Run SQL (after a backup) and Import the database (replaces the database with a dump, after an automatic backup).']],
      ['Actions: the programs of the system', ['The programs of the system shows the version of Node.js (which runs the application) and of cloudflared (which runs the tunnel) and the newest ones from the internet.', 'Update: asks twice and runs as an action; the steps are in Log. Node.js changes only inside the same major version (e.g. 22.x); a new major version is never installed by itself.', 'Node.js: the application stops for a moment; the file is checked with SHA-256 before it is installed; it takes full effect after the computer restarts.', 'cloudflared: updated with winget; the tunnel stops for a moment.']],
      ['Actions: start with Windows and self-start', ['Start with Windows: which parts start by themselves when the computer is switched on: application + database, the dashboard, the tunnel.', 'When the application falls by itself (not with Stop) and the application switch is on, the dashboard starts it again after 1 minute and notifies you.', 'If you stop it with the Stop button, or the switch is off, it does not start by itself; it starts only when you press Start.']],
      ['Actions: copy outside this PC', ['Choose a folder (an external disk, a network folder or a cloud folder such as OneDrive). Every backup is copied there automatically; it is checked every 5 minutes.', 'Copy copies the backups that are missing. If the copy fails you are notified. This way the backups survive even if this PC breaks.']],
      ['Actions: phone notifications (ntfy)', ['1) Install the free ntfy app on your phone. 2) Press + and subscribe to a topic name that you choose (long and secret, e.g. hrsystem-shop-k7x2). 3) In Actions press Set the topic and type exactly the same name. 4) Press Send a test. Under "What is notified" choose which kinds of messages arrive: application, addresses, backups, disk, updates and the daily report.', 'A notification arrives when: the application was stopped, started or restarted manually; it closed by itself (after 1 minute) or started by itself; the newest backup is older than 2 days; an address does not open for 5 minutes; a backup or update fails; an update completes; the copy outside this PC fails; the disk is nearly full. Every message has the company name, the importance (icon and sound) and the time.', 'The daily report arrives at the hour you set (08:00 by default; or as soon as the dashboard is open after that hour): application, database, backup, disk, addresses and version, with "all OK" or what is wrong. You can also send it yourself with "Send the report".', 'The topic name is like a password: do not share it. Messages contain no personal data.']],
      ['Actions: connections', ['GitHub token (read-only) to receive updates, stored encrypted. Cloudflare Tunnel for the public address.']],
      ['Backups', ['The name is Name-Date-Time.sql. Each backup shows the program version that was running when it was made and the OK or Damaged check (a complete file or not).', 'Download, Test, Restore, Open (folder), Delete. Test loads the backup into a temporary database, checks the tables and users and deletes it; your own database is not touched. Restore first makes a backup of the current state, then replaces the database with that backup.', 'A backup holds only the database. The program (code, forms) comes from GitHub and from the versions on this PC.']],
      ['History and diagnostics', ['History: the last 200 actions (backups, updates, rollbacks, stops, problems, copies outside this PC).', 'Log: the result of the last action. Download diagnostics gives a .txt file with the state and the end of the logs (secrets hidden), to send to someone when there is a problem.']],
      ['Settings (the gear)', ['The language of the whole dashboard: Shqip, English or Srpski. Theme: System, Light or Dark. Text size, high contrast, no animations, readable font, underlined links.', 'The dashboard password is optional: set it if several people use the computer. Forgot it? Delete the file manager\\dashboard.key.']],
      ['The dashboard updates itself', ['Every 10 minutes it checks the dashboard repo and takes the changes; after an update the page reloads once. When the dashboard restarts, an open page reloads by itself (no "forbidden").']],
      ['Common problems', ['The dashboard does not open: run Dashboard.bat (needs Administrator).', 'The application shows Off: press Start. If it fell by itself, see the History.', 'The page does not load on the phone: see the network diagnostics in the application.', 'Notifications do not arrive: check that the topic name is the same on the phone and in the dashboard, then Send a test.']],
    ],
  },

    sections: [
      ['Šta je ovo', ['Dashboard upravlja HRSystem instalacijom na ovom računaru: prati LIVE stanje, pravi backup, ažurira i vraća program, daje adrese i podatke, i šalje obaveštenja na telefon.', 'Otvara se pomoću Dashboard.bat i radi samo na ovom računaru (127.0.0.1). Nije dostupan sa interneta.', 'Zupčanik gore desno otvara Podešavanja. LIVE tačka u meniju pokazuje da je veza živa.']],
      ['Pregled', ['Aplikacija: Online ili Isključeno, sa vremenom odgovora u milisekundama. Dok je isključena ne meri se stalno.', 'Baza, Verzija (kada postoji nova verzija pojavljuje se obaveštenje "Ažuriraj") i javna Adresa.', 'Prostor koji zauzima HR: koliko diska zauzimaju program, baza i backup-i, plus koliko je slobodnog diska ostalo.', 'HR sistem: CPU i RAM samo aplikacije i njene baze (ne celog računara), i koliko dugo aplikacija radi.', 'Download / Upload (HR): koliko podataka HR sistem čita i piše, sa brzinom sada, današnjim ukupnim iznosom i ukupnim od pokretanja.', 'Poslednji backup, sa verzijom programa i oznakom OK ili Oštećen.', 'Dugmad gore: Otvori aplikaciju, Otvori /developer, Stop, Start, Restart. Stop je aktivan samo dok aplikacija radi, Start samo dok je isključena.']],
      ['Podaci', ['Adrese, instalacija (verzija, repozitorijum, fascikle, baza, portovi) i podešavanja sa tajnama (.env, tokeni). Tajne su skrivene: pritisni Prikaži ili Kopiraj.', 'Komanda za povezivanje sa bazom iz terminala.']],
      ['Adrese i tunel', ['Adrese su jedna lista: domeni koje aplikacija sama otkrije i privremena adresa su sve samo adrese. Svaka pokazuje da li se otvara.', 'Nijedna adresa se ne uklanja sama, čak ni kada se ne otvara. Uklanja se samo kada pritisneš Ukloni.', 'Promeni: izaberi privremenu adresu (bez domena, pravi se odmah, ali se menja svaki put kada se ponovo napravi) ili poveži svoj domen sa Cloudflare tunelom (token). Možeš ukloniti i tunel domena.', 'Privremena adresa preživljava restart i ažuriranje dashboard-a.']],
      ['Akcije: ažuriranje i vraćanje verzije', ['Ažuriraj aplikaciju: aktivno samo kada postoji nova verzija. Pravi backup, instalira, izvršava SQL migracije verzije i prelazi; ako ne uspe, sama se vraća na staru verziju. Prati je na traci napretka.', 'Vrati verziju: vraća kod (obrasce, dizajn) na stariju verziju, sa verzija na ovom računaru (bez preuzimanja) ili sa GitHub-a. "Vrati + bazu" vraća i bazu iz backup-a te verzije.', 'Posle vraćanja verzija se zakiva: automatsko ažuriranje i obaveštenje ignorišu verzije do one koju je GitHub imao. Ažuriranje se nastavlja kada se pojavi novija verzija ili kada pritisneš "Ukloni zakivanje".', 'Vraćanje koda ne menja bazu; ako je stara verzija zahteva, koristi "Vrati + bazu".']],
      ['Akcije: backup i Automatski', ['Backup pravi kopiju baze (samo baza).', 'Automatski: jedan raspored za backup i ažuriranje; izaberi sat i koliko backup-a da se čuva. Dva nezavisna prekidača: Backup baze i Ažuriraj program.', 'Kada postoji nova verzija i ažuriranje je uključeno, radi se ažuriranje (počinje backup-om), pa se baza čuva jednom, ne dvaput. Inače se pravi samo backup.', 'Brišu se samo backup-i koje je napravio ovaj raspored. Oni koje praviš ti, oni ažuriranja i sigurnosni backup-i pre vraćanja nikada se ne brišu.', 'Izvrši SQL (posle backup-a) i Uvezi bazu (zamenjuje bazu dump-om, posle automatskog backup-a).']],
      ['Akcije: programi sistema', ['Programi sistema prikazuje verziju Node.js (koji pokreće aplikaciju) i cloudflared (koji pokreće tunel) i najnovije sa interneta.', 'Ažuriraj: pita dvaput i pokreće se kao radnja; koraci su u Logu. Node.js se menja samo unutar iste glavne verzije (npr. 22.x); nova glavna verzija se nikad ne instalira sama.', 'Node.js: aplikacija se zaustavlja na trenutak; fajl se proverava SHA-256 pre instalacije; potpuno stupa na snagu posle restartovanja računara.', 'cloudflared: ažurira se pomoću winget; tunel se zaustavlja na trenutak.']],
      ['Akcije: pokretanje sa Windows-om i samopokretanje', ['Pokretanje sa Windows-om: koji se delovi pokreću sami kada se računar upali: aplikacija + baza, dashboard, tunel.', 'Kada aplikacija padne sama (ne pomoću Stop) i prekidač aplikacije je uključen, dashboard je ponovo pokreće posle 1 minuta i obaveštava te.', 'Ako je zaustaviš dugmetom Stop, ili je prekidač isključen, ne pokreće se sama; pokreće se samo kada pritisneš Start.']],

      ['Akcije: obaveštenja na telefonu (ntfy)', ['1) Instaliraj besplatnu ntfy aplikaciju na telefon. 2) Pritisni + i pretplati se na ime teme koje ti izabereš (dugo i tajno, npr. hrsystem-prodavnica-k7x2). 3) U Akcijama pritisni Postavi temu i upiši potpuno isto ime. 4) Pritisni Pošalji probu. Pod "Šta se šalje" izaberi koje vrste poruka stižu: aplikacija, adrese, backup-i, disk, ažuriranja i dnevni izveštaj.', 'Obaveštenje stiže kada: je aplikacija zaustavljena, pokrenuta ili restartovana ručno; se zatvorila sama (posle 1 minuta) ili se pokrenula sama; najnoviji backup je stariji od 2 dana; adresa se ne otvara 5 minuta; backup ili ažuriranje ne uspe; ažuriranje se završi; kopija van računara ne uspe; disk je skoro pun. Svaka poruka ima ime kompanije, važnost (ikonu i zvuk) i vreme.', 'Dnevni izveštaj stiže u sat koji izabereš (podrazumevano 08:00; ili čim se dashboard otvori posle tog sata): aplikacija, baza, backup, disk, adrese i verzija, sa "sve u redu" ili šta nije u redu. Možeš ga poslati i sam sa "Pošalji izveštaj sada".', 'Ime teme je kao lozinka: ne deli ga. Poruke ne sadrže lične podatke.']],

function applyPrefs() {
